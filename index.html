                                                <button class="qty-btn qty-minus" aria-label="تقليل الكمية" data-item-id="${itemId}">
                                                    <i class="fas fa-minus" aria-hidden="true"></i>
                                                </button>
                                                <span class="qty-num" data-item-id="${itemId}">${qty}</span>
                                                <button class="qty-btn qty-plus" aria-label="زيادة الكمية" data-item-id="${itemId}">
                                                    <i class="fas fa-plus" aria-hidden="true"></i>
                                                </button>
                                            </div>
                                            <button class="add-btn" data-name="${UI.escape(item.name)}" data-price="${item.price}" data-img="${imgSrc}" data-cat="${this._activeCategory}" aria-label="إضافة ${UI.escape(item.name)} إلى السلة">
                                                <i class="fas fa-cart-plus btn-icon" aria-hidden="true"></i>
                                                <span class="btn-label">أضف</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                    }).join('');

                    // ── Bind stepper events ──
                    grid.querySelectorAll('.qty-stepper').forEach(stepper => {
                        const itemId = stepper.getAttribute('data-item-id');
                        const card = stepper.closest('.menu-card');
                        const addBtn = card.querySelector('.add-btn');
                        const name = addBtn.getAttribute('data-name');
                        const price = parseFloat(addBtn.getAttribute('data-price'));
                        const img = addBtn.getAttribute('data-img');
                        const category = addBtn.getAttribute('data-cat');
                        const numSpan = stepper.querySelector('.qty-num');

                        const updateDisplay = () => {
                            const newQty = Cart.getQuantity(itemId);
                            numSpan.textContent = newQty;
                            if (newQty > 0) {
                                addBtn.classList.add('added');
                                addBtn.querySelector('.btn-label').textContent = 'في السلة';
                            } else {
                                addBtn.classList.remove('added');
                                addBtn.querySelector('.btn-label').textContent = 'أضف';
                            }
                        };

                        stepper.querySelector('.qty-minus').addEventListener('click', (e) => {
                            e.stopPropagation();
                            const currentQty = Cart.getQuantity(itemId);
                            if (currentQty > 0) {
                                Cart.removeOne(itemId);
                                updateDisplay();
                                document.getElementById('cartBadge').textContent = Cart.count;
                            }
                        });

                        stepper.querySelector('.qty-plus').addEventListener('click', (e) => {
                            e.stopPropagation();
                            Cart.add(name, price, img, category);
                            updateDisplay();
                            document.getElementById('cartBadge').textContent = Cart.count;
                        });

                        updateDisplay();
                    });

                    // ── Bind add button ──
                    grid.querySelectorAll('.add-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const name = btn.getAttribute('data-name');
                            const price = parseFloat(btn.getAttribute('data-price'));
                            const img = btn.getAttribute('data-img');
                            const category = btn.getAttribute('data-cat');
                            const itemId = UI.generateId(name, category);

                            if (Cart.getQuantity(itemId) > 0) {
                                const stepper = btn.closest('.menu-card').querySelector('.qty-stepper');
                                const numSpan = stepper?.querySelector('.qty-num');
                                if (numSpan) numSpan.textContent = Cart.getQuantity(itemId);
                                return;
                            }

                            Cart.add(name, price, img, category);
                            document.getElementById('cartBadge').textContent = Cart.count;

                            const stepper = btn.closest('.menu-card').querySelector('.qty-stepper');
                            const numSpan = stepper?.querySelector('.qty-num');
                            if (numSpan) numSpan.textContent = Cart.getQuantity(itemId);
                            btn.classList.add('added');
                            btn.querySelector('.btn-label').textContent = 'في السلة';
                        });
                    });

                    // ── Re-render on cart change ──
                    const origNotify = Cart._notify;
                    Cart._notify = function() {
                        origNotify.call(this);
                        if (grid && grid.isConnected) {
                            Menu.render();
                        }
                    };
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  6. MODAL
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const Modal = {
                _cartModal: null,
                _locationModal: null,
                _selectedLocation: getDefaultLocation(),

                init() {
                    this._cartModal = document.getElementById('cartModal');
                    this._locationModal = document.getElementById('locationModal');
                    const saved = Storage.get('koshary_hind_area');
                    if (saved) {
                        const loc = getLocationById(saved);
                        if (loc) this._selectedLocation = loc;
                    }
                },

                getSelectedLocation() { return this._selectedLocation; },
                getDeliveryFee() { return this._selectedLocation ? this._selectedLocation.fee : 10; },

                setSelectedLocation(loc) {
                    this._selectedLocation = loc;
                    Storage.set('koshary_hind_area', loc.id);
                },

                openCart() {
                    this._renderCart();
                    this._cartModal?.classList.add('active');
                },
                closeCart() {
                    this._cartModal?.classList.remove('active');
                },
                openLocation() {
                    this._renderLocation();
                    this._locationModal?.classList.add('active');
                },
                closeLocation() {
                    this._locationModal?.classList.remove('active');
                },

                _renderCart() {
                    const container = document.getElementById('cartItemsList');
                    const summary = document.getElementById('cartSummary');
                    const countBadge = document.getElementById('cartItemCountBadge');
                    const checkoutBtn = document.getElementById('checkoutBtn');

                    const items = Cart.items;
                    const count = Cart.count;

                    if (items.length === 0) {
                        container.innerHTML =
                            `<div class="empty-msg" style="padding:16px;" role="status"><i class="fas fa-shopping-bag" aria-hidden="true"></i>السلة فارغة<br><span style="font-size:0.7rem;">أضف أطباقك المفضلة</span></div>`;
                        summary.innerHTML = '';
                        checkoutBtn.disabled = true;
                        countBadge.textContent = '0';
                        return;
                    }

                    checkoutBtn.disabled = false;
                    countBadge.textContent = count;

                    let html = '';
                    items.forEach((item, idx) => {
                        html += `
                                <div class="cart-item-row" role="listitem">
                                    <div class="cart-item-info">
                                        <div>
                                            <div class="ci-name">${UI.escape(item.name)}</div>
                                            <div class="ci-price">${item.price} ج.م</div>
                                        </div>
                                    </div>
                                    <div class="cart-qty-control">
                                        <button class="cq-decr" data-idx="${idx}" aria-label="تقليل كمية ${UI.escape(item.name)}">−</button>
                                        <span class="cq-num">${item.quantity}</span>
                                        <button class="cq-incr" data-idx="${idx}" aria-label="زيادة كمية ${UI.escape(item.name)}">+</button>
                                        <button class="cq-remove" data-idx="${idx}" aria-label="حذف ${UI.escape(item.name)} من السلة"><i class="fas fa-trash-alt" aria-hidden="true"></i></button>
                                    </div>
                                    <div class="cart-item-total">${(item.price * item.quantity).toFixed(2)} ج.م</div>
                                </div>
                            `;
                    });
                    container.innerHTML = html;

                    const subtotal = Cart.total;
                    const deliveryFee = this.getDeliveryFee();
                    const grand = subtotal + deliveryFee;
                    summary.innerHTML = `
                            <div class="cart-summary-row"><span>المجموع الفرعي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                            <div class="cart-summary-row"><span>رسوم التوصيل (${this._selectedLocation ? this._selectedLocation.name : 'سخا'})</span><span>${deliveryFee.toFixed(2)} ج.م</span></div>
                            <div class="cart-total"><span>الإجمالي</span><span>${grand.toFixed(2)} ج.م</span></div>
                        `;

                    container.querySelectorAll('.cq-decr').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.getAttribute('data-idx'));
                            Cart.decrement(idx);
                            this._renderCart();
                            Menu.render();
                        });
                    });
                    container.querySelectorAll('.cq-incr').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.getAttribute('data-idx'));
                            Cart.increment(idx);
                            this._renderCart();
                            Menu.render();
                        });
                    });
                    container.querySelectorAll('.cq-remove').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.getAttribute('data-idx'));
                            Cart.remove(idx);
                            this._renderCart();
                            Menu.render();
                        });
                    });
                },

                _renderLocation() {
                    const grid = document.getElementById('locationGrid');
                    if (!grid) return;
                    grid.innerHTML = LOCATIONS_DATA.map(loc => `
                            <div class="location-card-item" data-coords="${loc.coords}" data-name="${UI.escape(loc.name)}" role="listitem">
                                <div class="loc-icon"><i class="fas ${loc.icon}" aria-hidden="true"></i></div>
                                <div class="loc-info">
                                    <h4>${UI.escape(loc.name)}</h4>
                                    <p><i class="fas fa-map-pin" aria-hidden="true"></i> ${UI.escape(loc.address)}</p>
                                </div>
                                <div class="loc-arrow"><i class="fas fa-chevron-left" aria-hidden="true"></i></div>
                            </div>
                        `).join('');

                    grid.querySelectorAll('.location-card-item').forEach(card => {
                        card.addEventListener('click', () => {
                            const coords = card.getAttribute('data-coords');
                            const name = card.getAttribute('data-name');
                            window.open(
                                `https://www.google.com/maps/search/?api=1&query=${coords}&q=${encodeURIComponent(name)}`,
                                '_blank');
                            this.closeLocation();
                        });
                    });
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  7. CHECKOUT — with Two-Level Category Dropdown
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const Checkout = {
                start() {
                    if (Cart.count === 0) return;
                    this._showCustomerForm();
                },

                _showCustomerForm(prefill) {
                    prefill = prefill || {};
                    const currentLoc = Modal.getSelectedLocation();

                    // Build the two-level dropdown HTML
                    let categoriesHtml = '';
                    for (const [key, cat] of Object.entries(DELIVERY_DATA)) {
                        const isInside = key === 'inside';
                        const badgeClass = cat.badgeClass;

                        let locsHtml = '';
                        for (const loc of cat.locations) {
                            const isSelected = currentLoc && currentLoc.id === loc.id;
                            locsHtml += `
                                <div class="area-location-item ${isSelected ? 'selected' : ''}" data-loc-id="${loc.id}" data-loc-name="${UI.escape(loc.name)}" data-loc-fee="${loc.fee}" data-category="${key}">
                                    <span class="loc-item-name">
                                        ${isSelected ? '<i class="fas fa-check-circle check-icon" aria-hidden="true"></i>' : ''}
                                        ${UI.escape(loc.name)}
                                    </span>
                                    <span class="loc-item-fee ${isSelected ? 'gold' : ''}">${loc.fee} ج.م</span>
                                </div>
                            `;
                        }

                        categoriesHtml += `
                            <div class="area-category-item" data-category="${key}">
                                <span class="cat-info">
                                    <i class="fas ${cat.icon}" aria-hidden="true"></i>
                                    ${cat.label}
                                    <span class="cat-badge ${badgeClass}">${cat.badge}</span>
                                </span>
                                <span class="cat-arrow"><i class="fas fa-chevron-down" aria-hidden="true"></i></span>
                            </div>
                            <div class="area-locations-container" data-category="${key}">
                                ${locsHtml}
                            </div>
                        `;
                    }

                    // Hidden select for form submission
                    const areaOptions = ALL_LOCATIONS.map(l =>
                        `<option value="${l.id}" ${currentLoc && currentLoc.id === l.id ? 'selected' : ''}>${l.name} (${l.fee} ج.م)</option>`
                    ).join('');

                    Swal.fire({
                        title: '📝 بيانات التوصيل',
                        html: `
                                <div style="text-align:right;">
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-user" aria-hidden="true"></i> الاسم الكامل</label>
                                        <input type="text" id="custName" placeholder="أدخل اسمك" value="${UI.escape(prefill.name || '')}" autocomplete="name" />
                                    </div>
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-phone" aria-hidden="true"></i> رقم الجوال</label>
                                        <input type="tel" id="custPhone" placeholder="مثال: 01012345678" value="${UI.escape(prefill.phone || '')}" autocomplete="tel" />
                                    </div>
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-map-pin" aria-hidden="true"></i> عنوان التوصيل</label>
                                        <textarea id="custAddress" rows="2" placeholder="اكتب عنوانك بالتفصيل" autocomplete="street-address">${UI.escape(prefill.address || '')}</textarea>
                                    </div>

                                    <!-- ===== TWO-LEVEL AREA DROPDOWN ===== -->
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-location-dot" aria-hidden="true"></i> اختر منطقتك</label>
                                        <div class="area-dropdown-wrapper" id="areaDropdownWrapper">
                                            <!-- Trigger -->
                                            <div class="area-dropdown-trigger" id="areaDropdownTrigger">
                                                <span class="trigger-text">
                                                    <i class="fas fa-map-pin loc-icon" aria-hidden="true"></i>
                                                    <span class="loc-name">${currentLoc ? UI.escape(currentLoc.name) : 'اختر المنطقة'}</span>
                                                    <span class="loc-fee">${currentLoc ? currentLoc.fee + ' ج.م' : ''}</span>
                                                </span>
                                                <span class="trigger-arrow" id="dropdownArrow"><i class="fas fa-chevron-down" aria-hidden="true"></i></span>
                                            </div>
                                            <!-- Panel -->
                                            <div class="area-dropdown-panel" id="areaDropdownPanel">
                                                ${categoriesHtml}
                                            </div>
                                        </div>
                                        <!-- Fee Preview -->
                                        <div class="fee-preview" id="feePreviewArea">
                                            <span>💰 رسوم التوصيل</span>
                                            <span class="fee-amount"><span class="fee-num" id="feeDisplayNum">${currentLoc ? currentLoc.fee : 10}</span> ج.م</span>
                                        </div>
                                    </div>

                                    <select id="custAreaHidden" style="display:none;">
                                        ${areaOptions}
                                    </select>
                                </div>
                            `,
                        showCancelButton: true,
                        cancelButtonText: 'إلغاء',
                        cancelButtonColor: '#8a7a6a',
                        confirmButtonText: 'مراجعة الطلب ➜',
                        confirmButtonColor: '#b81a20',
                        allowOutsideClick: false,
                        didOpen: () => {
                            // ── Setup two-level dropdown ──
                            const trigger = document.getElementById('areaDropdownTrigger');
                            const panel = document.getElementById('areaDropdownPanel');
                            const arrow = document.getElementById('dropdownArrow');
                            const feeDisplay = document.getElementById('feeDisplayNum');
                            const wrapper = document.getElementById('areaDropdownWrapper');

                            // Toggle dropdown
                            trigger.addEventListener('click', (e) => {
                                e.stopPropagation();
                                const isOpen = panel.classList.contains('open');
                                panel.classList.toggle('open');
                                if (arrow) arrow.classList.toggle('open');
                            });

                            // Close dropdown when clicking outside
                            document.addEventListener('click', (e) => {
                                if (wrapper && !wrapper.contains(e.target)) {
                                    panel.classList.remove('open');
                                    if (arrow) arrow.classList.remove('open');
                                }
                            });

                            // ── Category click: toggle locations ──
                            panel.querySelectorAll('.area-category-item').forEach(catItem => {
                                catItem.addEventListener('click', () => {
                                    const category = catItem.getAttribute('data-category');
                                    const container = panel.querySelector(
                                        `.area-locations-container[data-category="${category}"]`);
                                    const catArrow = catItem.querySelector('.cat-arrow');

                                    // Close all other categories
                                    panel.querySelectorAll('.area-locations-container').forEach(cont => {
                                        if (cont.getAttribute('data-category') !== category) {
                                            cont.classList.remove('open');
                                            const otherCat = panel.querySelector(
                                                `.area-category-item[data-category="${cont.getAttribute('data-category')}"]`
                                                );
                                            if (otherCat) {
                                                otherCat.querySelector('.cat-arrow')?.classList.remove(
                                                'expanded');
                                            }
                                        }
                                    });

                                    // Toggle this category
                                    if (container) {
                                        container.classList.toggle('open');
                                        if (catArrow) catArrow.classList.toggle('expanded');
                                    }
                                });
                            });

                            // ── Location item click ──
                            panel.querySelectorAll('.area-location-item').forEach(item => {
                                item.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    const locId = parseInt(item.getAttribute('data-loc-id'));
                                    const locName = item.getAttribute('data-loc-name');
                                    const locFee = parseInt(item.getAttribute('data-loc-fee'));

                                    // Update selected state
                                    panel.querySelectorAll('.area-location-item').forEach(el => el
                                        .classList.remove('selected'));
                                    item.classList.add('selected');

                                    // Update trigger text
                                    const triggerText = trigger.querySelector('.trigger-text');
                                    const nameSpan = triggerText.querySelector('.loc-name');
                                    const feeSpan = triggerText.querySelector('.loc-fee');
                                    if (nameSpan) nameSpan.textContent = locName;
                                    if (feeSpan) feeSpan.textContent = locFee + ' ج.م';

                                    // Update fee display
                                    if (feeDisplay) feeDisplay.textContent = locFee;

                                    // Update selected location in Modal
                                    const loc = getLocationById(locId);
                                    if (loc) {
                                        Modal.setSelectedLocation(loc);
                                        const hiddenSelect = document.getElementById('custAreaHidden');
                                        if (hiddenSelect) {
                                            hiddenSelect.value = locId;
                                        }
                                    }

                                    // Close dropdown
                                    panel.classList.remove('open');
                                    if (arrow) arrow.classList.remove('open');

                                    // Close all category containers
                                    panel.querySelectorAll('.area-locations-container').forEach(cont => cont
                                        .classList.remove('open'));
                                    panel.querySelectorAll('.area-category-item .cat-arrow').forEach(a => a
                                        .classList.remove('expanded'));
                                });
                            });

                            // ── Auto-expand the category of the current selection ──
                            if (currentLoc) {
                                const catKey = currentLoc.category;
                                const container = panel.querySelector(
                                    `.area-locations-container[data-category="${catKey}"]`);
                                const catItem = panel.querySelector(
                                    `.area-category-item[data-category="${catKey}"]`);
                                if (container && catItem) {
                                    container.classList.add('open');
                                    catItem.querySelector('.cat-arrow')?.classList.add('expanded');
                                }
                            }

                            // ── Focus first input ──
                            setTimeout(() => document.getElementById('custName')?.focus(), 150);
                        },
                        preConfirm: () => {
                            const name = document.getElementById('custName')?.value?.trim();
                            const phone = document.getElementById('custPhone')?.value?.trim();
                            const address = document.getElementById('custAddress')?.value?.trim();

                            const hiddenSelect = document.getElementById('custAreaHidden');
                            let areaId = hiddenSelect ? parseInt(hiddenSelect.value) : Modal.getSelectedLocation()
                                .id;
                            const area = getLocationById(areaId) || Modal.getSelectedLocation();

                            if (!name) { Swal.showValidationMessage('يرجى إدخال الاسم'); return false; }
                            if (!phone) { Swal.showValidationMessage('يرجى إدخال رقم الجوال'); return false; }
                            if (!address) { Swal.showValidationMessage('يرجى إدخال العنوان'); return false; }
                            const cleanPhone = phone.replace(/[\s-]/g, '');
                            if (!/^\+?\d{8,15}$/.test(cleanPhone)) {
                                Swal.showValidationMessage('رقم الجوال غير صحيح');
                                return false;
                            }

                            if (area) Modal.setSelectedLocation(area);
                            return { name, phone: cleanPhone, address, area };
                        }
                    }).then((result) => {
                        if (result.isConfirmed && result.value) {
                            const { name, phone, address, area } = result.value;
                            this._showOrderReview(name, phone, address, area);
                        }
                    });
                },

                _showOrderReview(name, phone, address, area) {
                    const subtotal = Cart.total;
                    const deliveryFee = area ? area.fee : Modal.getDeliveryFee();
                    const grandTotal = subtotal + deliveryFee;

                    const rowsHtml = Cart.items.map(item => `
                            <div class="os-row">
                                <span>${UI.escape(item.name)} × ${item.quantity}</span>
                                <span>${(item.price * item.quantity).toFixed(2)} ج.م</span>
                            </div>
                        `).join('');

                    Swal.fire({
                        title: '✅ مراجعة الطلب',
                        html: `
                                <div style="text-align:right;font-size:0.8rem;margin-bottom:10px;background:var(--surface-container-low);padding:8px 12px;border-radius:10px;border:2px solid var(--outline-variant);">
                                    <div><i class="fas fa-user" style="color:var(--brand-primary);"></i> ${UI.escape(name)}</div>
                                    <div><i class="fas fa-phone" style="color:var(--brand-primary);"></i> ${UI.escape(phone)}</div>
                                    <div><i class="fas fa-map-pin" style="color:var(--brand-primary);"></i> ${UI.escape(address)}</div>
                                    <div><i class="fas fa-location-dot" style="color:var(--brand-tertiary);"></i> ${area ? UI.escape(area.name) : 'غير محدد'} — <strong>${deliveryFee} ج.م</strong></div>
                                </div>
                                <div class="order-summary-box">
                                    ${rowsHtml}
                                    <div class="os-row border-top"><span>المجموع الفرعي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                                    <div class="os-row"><span>رسوم التوصيل (${area ? UI.escape(area.name) : ''})</span><span>${deliveryFee.toFixed(2)} ج.م</span></div>
                                    <div class="os-row total"><span>الإجمالي</span><span>${grandTotal.toFixed(2)} ج.م</span></div>
                                </div>
                                <div style="font-size:0.65rem;color:var(--on-surface-variant);text-align:center;margin-top:4px;">
                                    <i class="fas fa-whatsapp" style="color:#25D366;"></i> سيتم إرسال الطلب عبر واتساب
                                </div>
                            `,
                        showCancelButton: true,
                        cancelButtonText: '⟵ تعديل البيانات',
                        cancelButtonColor: '#8a7a6a',
                        confirmButtonText: 'إرسال عبر واتساب 📤',
                        confirmButtonColor: '#25D366',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            this._sendOrder(name, phone, address, area);
                        } else if (result.dismiss === Swal.DismissReason.cancel) {
                            this._showCustomerForm({ name, phone, address });
                        }
                    });
                },

                _sendOrder(name, phone, address, area) {
                    const subtotal = Cart.total;
                    const deliveryFee = area ? area.fee : Modal.getDeliveryFee();
                    const grandTotal = subtotal + deliveryFee;

                    const orderLines = Cart.items.map(item =>
                        `• ${item.name} × ${item.quantity} = ${(item.price * item.quantity).toFixed(2)} ج.م`
                    ).join('\n');

                    const messageLines = [
                        '🍽️ *طلب جديد من كشري هند*',
                        '━━━━━━━━━━━━━━━━━━━━━',
                        `👤 *الاسم:* ${name}`,
                        `📱 *الجوال:* ${phone}`,
                        `📍 *العنوان:* ${address}`,
                        `📍 *المنطقة:* ${area ? area.name : 'غير محدد'}`,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        '📋 *تفاصيل الطلب:*',
                        orderLines,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        `💰 *إجمالي الطلب:* ${subtotal.toFixed(2)} ج.م`,
                        `🚚 *رسوم التوصيل (${area ? area.name : ''}):* ${deliveryFee.toFixed(2)} ج.م`,
                        `💎 *الإجمالي النهائي:* ${grandTotal.toFixed(2)} ج.م`,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        '🌟 شكراً لثقتكم بكشري هند!'
                    ];
                    const message = messageLines.join('\n');
                    const encoded = encodeURIComponent(message);
                    const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encoded}`;
                    window.open(whatsappUrl, '_blank');

                    Cart.clear();
                    Modal.closeCart();
                    Menu.render();
                    document.getElementById('cartBadge').textContent = '0';
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  8. APP
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const App = {
                init() {
                    Cart.init();
                    Modal.init();
                    Menu.init('menuGrid', 'bottomNav');

                    Cart.onUpdate(() => {
                        document.getElementById('cartBadge').textContent = Cart.count;
                        if (document.getElementById('cartModal')?.classList.contains('active')) {
                            Modal._renderCart();
                        }
                        Menu.render();
                    });

                    document.getElementById('cartIconBtn')?.addEventListener('click', () => {
                        Modal.openCart();
                    });

                    document.getElementById('locationBtn')?.addEventListener('click', () => {
                        Modal.openLocation();
                    });

                    document.getElementById('locationCloseBtn')?.addEventListener('click', () => {
                        Modal.closeLocation();
                    });
                    document.getElementById('locationModal')?.addEventListener('click', (e) => {
                        if (e.target === e.currentTarget) Modal.closeLocation();
                    });

                    document.getElementById('modalCloseBtn')?.addEventListener('click', () => {
                        Modal.closeCart();
                    });
                    document.getElementById('cartModal')?.addEventListener('click', (e) => {
                        if (e.target === e.currentTarget) Modal.closeCart();
                    });

                    document.getElementById('deleteAllCartBtn')?.addEventListener('click', () => {
                        if (Cart.count === 0) return;
                        Swal.fire({
                            title: 'إفراغ السلة؟',
                            text: 'سيتم حذف جميع الأصناف',
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#ba1a1a',
                            cancelButtonColor: '#8a7a6a',
                            confirmButtonText: 'نعم، إفراغ',
                            cancelButtonText: 'إلغاء'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                Cart.clear();
                                Modal._renderCart();
                                Menu.render();
                                document.getElementById('cartBadge').textContent = '0';
                            }
                        });
                    });

                    document.getElementById('checkoutBtn')?.addEventListener('click', () => {
                        Checkout.start();
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            if (document.getElementById('cartModal')?.classList.contains('active')) {
                                Modal.closeCart();
                            }
                            if (document.getElementById('locationModal')?.classList.contains('active')) {
                                Modal.closeLocation();
                            }
                        }
                        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                            e.preventDefault();
                            Modal.openCart();
                        }
                    });

                    document.getElementById('cartBadge').textContent = Cart.count;
                    console.log('✅ كشري هند — دروب داون بطبقتين يعمل بسلاسة');
                }
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => App.init());
            } else {
                App.init();
            }

        })();
    </script>
</body>
</html>
