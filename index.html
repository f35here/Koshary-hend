<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>كشري هند</title>
    <link rel="icon" type="image/jpeg" href="./images/logo.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>

    <style>
        /* ── جميع الـ styles كما هي بدون تغيير ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --brand-primary: #b81a20;
            --brand-primary-dark: #8a1015;
            --brand-secondary: #fdc003;
            --brand-secondary-dark: #7a5a00;
            --brand-tertiary: #11651d;

            --surface: #fcf7f0;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f8f1e9;
            --surface-container: #f2ebe2;
            --on-surface: #1c1a15;
            --on-surface-variant: #5a423e;
            --outline-variant: #e2bcb8;
            --outline: #8f706c;

            --error: #ba1a1a;
            --error-container: #ffdad6;

            --font-headline: 'Be Vietnam Pro', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;

            --bottom-nav-height: 68px;
            --gutter: 14px;
            --container-max: 1400px;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-dropdown: 0 12px 48px rgba(0, 0, 0, 0.12);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface);
            color: var(--on-surface);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-nav-height) + 36px);
            line-height: 1.5;
        }

        img {
            max-width: 100%;
            display: block;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            font-size: inherit;
        }
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
            border: none;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface-container);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brand-primary);
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 2px solid var(--brand-primary);
            padding: 4px 0;
        }

        .header-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2px var(--gutter);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 52px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo-wrapper {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 9999px;
            overflow: hidden;
            border: 2px solid var(--brand-secondary);
            background: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h1 {
            font-family: var(--font-headline);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--brand-primary);
            letter-spacing: -0.03em;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text .sub {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-text .sub i {
            color: var(--brand-secondary);
            font-size: 0.45rem;
        }

        .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            color: var(--brand-primary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.location-btn {
            color: var(--brand-tertiary);
            border-color: var(--brand-tertiary);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--brand-secondary);
            color: var(--brand-secondary-dark);
            font-size: 0.5rem;
            font-weight: 800;
            width: 22px;
            height: 22px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-headline);
            border: 2px solid var(--surface-container-lowest);
        }

        /* ═══════════════════════════════════════════════════════════════
           MENU
           ═══════════════════════════════════════════════════════════════ */
        .menu-container {
            max-width: var(--container-max);
            margin: 12px auto 0;
            padding: 0 var(--gutter) calc(var(--bottom-nav-height) + 30px);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }

        .menu-card {
            background: var(--surface-container-lowest);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--outline-variant);
            display: flex;
            flex-direction: column;
        }

        .menu-card .card-img {
            width: 100%;
            height: 150px;
            overflow: hidden;
            background: var(--surface-container);
            flex-shrink: 0;
            position: relative;
        }

        .menu-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.45s ease-in-out;
        }

        .menu-card .card-img img.loaded {
            opacity: 1;
        }

        .menu-card .card-img .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--outline);
            background: var(--surface-container);
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .menu-card .card-img img.loaded+.img-placeholder {
            display: none !important;
        }

        .menu-card .card-body {
            padding: 12px 12px 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 4px;
        }

        .menu-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .menu-card .item-name {
            font-family: var(--font-headline);
            font-size: 0.85rem;
            font-weight: 800;
            color: #b81a20;
            line-height: 1.2;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .menu-card .item-name .name-icon {
            color: var(--brand-secondary);
            font-size: 0.55rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .menu-card .price-badge {
            background: linear-gradient(135deg, #fdc003, #fdd003);
            color: #7a5a00;
            font-family: var(--font-headline);
            font-weight: 800;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 9999px;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid rgba(253, 192, 3, 0.3);
        }

        .menu-card .item-desc {
            font-size: 0.6rem;
            color: var(--on-surface-variant);
            font-weight: 400;
            line-height: 1.3;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .menu-card .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: auto;
        }

        .menu-card .qty-stepper {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--surface-container-low);
            border-radius: 9999px;
            padding: 2px;
            border: 2px solid var(--outline-variant);
            flex-shrink: 0;
            overflow: hidden;
        }

        .menu-card .qty-stepper .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--brand-primary);
            flex-shrink: 0;
        }

        .menu-card .qty-stepper .qty-btn.qty-minus {
            background: var(--brand-primary-dark);
        }

        .menu-card .qty-stepper .qty-btn.qty-plus {
            background: var(--brand-primary);
        }

        .menu-card .qty-stepper .qty-num {
            min-width: 24px;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            font-family: var(--font-headline);
            color: var(--on-surface);
            padding: 0 4px;
        }

        .menu-card .add-btn {
            flex: 1;
            min-width: 60px;
            padding: 6px 10px;
            border-radius: 9999px;
            background: var(--brand-primary);
            color: #ffffff;
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid var(--brand-primary);
            min-height: 34px;
        }

        .menu-card .add-btn .btn-icon {
            color: #ffffff;
        }

        .menu-card .add-btn .btn-label {
            color: #ffffff;
        }

        .menu-card .add-btn.added {
            background: var(--brand-tertiary);
            border-color: var(--brand-tertiary);
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--on-surface-variant);
            font-family: var(--font-body);
            background: var(--surface-container-low);
            border-radius: 18px;
            border: 2px dashed var(--outline-variant);
        }

        .empty-msg i {
            font-size: 2.6rem;
            color: var(--outline-variant);
            display: block;
            margin-bottom: 12px;
        }

        /* ═══════════════════════════════════════════════════════════════
           BOTTOM NAV
           ═══════════════════════════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            width: calc(100% - 24px);
            max-width: 640px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--outline-variant);
            border-radius: 28px;
            padding: 4px 4px;
            height: var(--bottom-nav-height);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .bottom-nav .nav-item {
            flex: 0 0 auto;
            padding: 4px 12px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            border: 2px solid transparent;
            background: transparent;
            color: var(--on-surface-variant);
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            white-space: nowrap;
            padding: 4px 14px;
            min-height: 48px;
            min-width: 52px;
        }

        .bottom-nav .nav-item i {
            font-size: 1rem;
            color: var(--brand-secondary-dark);
        }

        .bottom-nav .nav-item .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .bottom-nav .nav-item.active {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
            color: #ffffff;
            border-color: var(--brand-primary);
        }

        .bottom-nav .nav-item.active i {
            color: #ffffff;
        }

        /* ═══════════════════════════════════════════════════════════════
           LOCATION POPUP
           ═══════════════════════════════════════════════════════════════ */
        .location-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .location-modal-overlay.active {
            display: flex;
        }

        .location-modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: 18px;
            padding: 24px 20px 20px;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--brand-primary);
        }

        .location-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--brand-primary);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .location-modal-header h2 {
            font-family: var(--font-headline);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-modal-header h2 i {
            color: var(--brand-tertiary);
        }

        .location-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 9999px;
            background: var(--surface-container);
            border: 2px solid var(--outline-variant);
            color: var(--on-surface);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .location-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .location-card-item {
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .location-card-item .loc-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .location-card-item .loc-info {
            flex: 1;
            min-width: 0;
        }

        .location-card-item .loc-info h4 {
            font-family: var(--font-headline);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--on-surface);
        }

        .location-card-item .loc-info p {
            font-size: 0.7rem;
            color: var(--on-surface-variant);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .location-card-item .loc-info p i {
            color: var(--brand-secondary-dark);
            font-size: 0.6rem;
        }

        .location-card-item .loc-arrow {
            color: var(--brand-primary);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ═══════════════════════════════════════════════════════════════
           CART MODAL
           ═══════════════════════════════════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            padding: 24px 22px 22px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 8px 24px rgba(0, 0, 0, 0.06);
            border: none;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-header .modal-title {
            font-family: var(--font-headline);
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header .modal-title i {
            font-size: 1.3rem;
            color: var(--brand-secondary-dark);
            background: rgba(253, 192, 3, 0.15);
            padding: 8px;
            border-radius: 50%;
        }

        .modal-header .modal-title span {
            background: var(--brand-secondary);
            color: var(--brand-secondary-dark);
            font-size: 0.65rem;
            padding: 2px 12px;
            border-radius: 9999px;
            font-weight: 700;
            margin-right: 4px;
        }

        .delete-all-btn {
            background: transparent;
            border: none;
            color: var(--error);
            font-size: 1rem;
            padding: 6px 10px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            font-weight: 600;
        }

        .delete-all-btn:hover {
            background: rgba(186, 26, 26, 0.08);
        }

        .delete-all-btn i {
            font-size: 1.1rem;
        }

        .cart-items-list {
            margin: 4px 0 16px;
            max-height: 34vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        .cart-items-list::-webkit-scrollbar {
            width: 3px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            gap: 10px;
            flex-wrap: wrap;
            transition: background 0.15s;
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .cart-item-row:hover {
            background: rgba(0, 0, 0, 0.01);
        }

        .cart-item-info {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 2;
            min-width: 100px;
        }

        .cart-item-info .ci-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--on-surface);
            font-family: var(--font-headline);
        }

        .cart-item-info .ci-price {
            font-size: 0.7rem;
            color: var(--on-surface-variant);
            font-weight: 500;
            background: var(--surface-container-low);
            padding: 2px 10px;
            border-radius: 9999px;
        }

        .cart-qty-control {
            display: flex;
            gap: 4px;
            align-items: center;
            background: var(--surface-container-low);
            border-radius: 9999px;
            padding: 3px 6px;
            border: none;
            flex-shrink: 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }

        .cart-qty-control button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            transition: background 0.2s, transform 0.1s;
        }

        .cart-qty-control button:hover {
            background: rgba(184, 26, 32, 0.08);
            transform: scale(1.05);
        }

        .cart-qty-control .cq-num {
            min-width: 22px;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            font-family: var(--font-headline);
            color: var(--on-surface);
        }

        .cart-qty-control .cq-remove {
            color: var(--error);
            font-size: 0.7rem;
        }

        .cart-item-total {
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--brand-primary);
            font-family: var(--font-headline);
            flex-shrink: 0;
            background: rgba(184, 26, 32, 0.04);
            padding: 2px 12px;
            border-radius: 9999px;
        }

        .cart-summary {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 16px;
            margin-top: 4px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--on-surface-variant);
            margin-bottom: 6px;
            font-weight: 500;
            padding: 0 2px;
        }

        .cart-total {
            font-size: 1.1rem;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            color: var(--brand-primary);
            font-family: var(--font-headline);
            border-top: 2px solid var(--brand-secondary);
            padding-top: 12px;
            margin-top: 6px;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .close-modal-btn {
            background: var(--surface-container);

                    this._items = Array.isArray(saved) ? saved : [];
                    this._notify();
                },

                get items() {
                    return this._items.slice();
                },
                get total() {
                    return this._items.reduce((s, i) => s + (i.price * i.quantity), 0);
                },
                get count() {
                    return this._items.reduce((s, i) => s + i.quantity, 0);
                },

                getQuantity(itemId) {
                    const found = this._items.find(i => i.id === itemId);
                    return found ? found.quantity : 0;
                },

                add(name, price, img, category) {
                    const id = `${category}_${name.replace(/\s/g, '')}`;
                    const existing = this._items.find(i => i.id === id);
                    if (existing) {
                        existing.quantity += 1;
                    } else {
                        this._items.push({ id, name, price, img, quantity: 1, category });
                    }
                    this._persist();
                    this._notify();
                },

                removeOne(itemId) {
                    const idx = this._items.findIndex(i => i.id === itemId);
                    if (idx === -1) return;
                    if (this._items[idx].quantity > 1) {
                        this._items[idx].quantity -= 1;
                    } else {
                        this._items.splice(idx, 1);
                    }
                    this._persist();
                    this._notify();
                },

                remove(idx) {
                    if (idx >= 0 && idx < this._items.length) {
                        this._items.splice(idx, 1);
                        this._persist();
                        this._notify();
                    }
                },

                increment(idx) {
                    if (idx >= 0 && idx < this._items.length) {
                        this._items[idx].quantity += 1;
                        this._persist();
                        this._notify();
                    }
                },

                decrement(idx) {
                    if (idx >= 0 && idx < this._items.length) {
                        if (this._items[idx].quantity > 1) {
                            this._items[idx].quantity -= 1;
                        } else {
                            this._items.splice(idx, 1);
                        }
                        this._persist();
                        this._notify();
                    }
                },

                clear() {
                    this._items = [];
                    this._persist();
                    this._notify();
                },

                onUpdate(fn) {
                    this._listeners.push(fn);
                },

                _persist() {
                    Storage.set('koshary_hind_cart', this._items);
                },
                _notify() {
                    this._listeners.forEach(fn => fn(this._items.slice()));
                    // تحديث جزئي دون إعادة رسم كامل
                    if (typeof Menu !== 'undefined' && Menu.updateItems) {
                        Menu.updateItems();
                    }
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  4. UI HELPERS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const UI = {
                escape(str) {
                    if (!str) return '';
                    return String(str).replace(/&/g, '&amp;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                },

                generateId(name, category) {
                    return `${category}_${name.replace(/\s/g, '')}`;
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  5. LAZY LOADER (Intersection Observer)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const LazyLoader = {
                _observer: null,

                init() {
                    if (!('IntersectionObserver' in window)) {
                        return;
                    }
                    this._observer = new IntersectionObserver((entries) => {
                        for (const entry of entries) {
                            if (entry.isIntersecting) {
                                const img = entry.target;
                                const dataSrc = img.getAttribute('data-src');
                                if (dataSrc) {
                                    img.src = dataSrc;
                                    img.removeAttribute('data-src');
                                    img.addEventListener('load', () => {
                                        img.classList.add('loaded');
                                    });
                                    img.addEventListener('error', () => {
                                        img.style.display = 'none';
                                        const placeholder = img.nextElementSibling;
                                        if (placeholder && placeholder.classList.contains(
                                                'img-placeholder')) {
                                            placeholder.style.display = 'flex';
                                        }
                                    });
                                }
                                this._observer.unobserve(img);
                            }
                        }
                    }, {
                        rootMargin: '100px 0px 100px 0px',
                        threshold: 0.01
                    });
                },

                observe(img) {
                    if (!img) return;
                    if (this._observer) {
                        this._observer.observe(img);
                    } else {
                        const dataSrc = img.getAttribute('data-src');
                        if (dataSrc) {
                            img.src = dataSrc;
                            img.removeAttribute('data-src');
                            img.addEventListener('load', () => {
                                img.classList.add('loaded');
                            });
                            img.addEventListener('error', () => {
                                img.style.display = 'none';
                                const placeholder = img.nextElementSibling;
                                if (placeholder && placeholder.classList.contains('img-placeholder')) {
                                    placeholder.style.display = 'flex';
                                }
                            });
                        }
                    }
                },

                refresh(container) {
                    if (!container) return;
                    const imgs = container.querySelectorAll('img[data-src]');
                    for (const img of imgs) {
                        this.observe(img);
                    }
                },

                observeAll() {
                    const imgs = document.querySelectorAll('img[data-src]');
                    for (const img of imgs) {
                        this.observe(img);
                    }
                }
            };

                setActive(categoryId) {
                    this._activeCategory = categoryId;

                    this.render();
                    const container = document.getElementById('mainContent');
                    if (container) {
                        container.scrollIntoView({ behavior: 'smooth', block: 'start' });

                },

                getActive() { return this._activeCategory; },

                renderNav() {
                    const nav = this._navContainer;
                    if (!nav) return;
                    nav.innerHTML = '';

                        item.innerHTML = `

                    summary.innerHTML = `
                            <div class="cart-summary-row"><span>المجموع الفرعي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                            <div class="fee-message">
                                <i class="fas fa-info-circle" aria-hidden="true"></i>
                                سيتم التواصل معك لتحديد رسوم الدليفري
                            </div>
                            <div class="cart-total"><span>الإجمالي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                        `;

                    container.querySelectorAll('.cq-decr').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.getAttribute('data-idx'));
                            Cart.decrement(idx);
                            this._renderCart();
                            Menu.updateItems();
                        });
                    });
                    container.querySelectorAll('.cq-incr').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.getAttribute('data-idx'));
                            Cart.increment(idx);
                            this._renderCart();
                            Menu.updateItems();
                        });
                    });
                    container.querySelectorAll('.cq-remove').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.getAttribute('data-idx'));
                            Cart.remove(idx);
                            this._renderCart();
                            Menu.updateItems();
                        });
                    });
                },

                _renderLocation() {
                    const grid = document.getElementById('locationGrid');
                    if (!grid) return;
                    grid.innerHTML = LOCATIONS_DATA.map(loc => `
                            <div class="location-card-item" data-coords="${loc.coords}" data-name="${UI.escape(loc.name)}" role="listitem">
                                <div class="loc-icon"><i class="fas ${loc.icon}" aria-hidden="true"></i></div>
                                <div class="loc-info">
                                    <h4>${UI.escape(loc.name)}</h4>
                                    <p><i class="fas fa-map-pin" aria-hidden="true"></i> ${UI.escape(loc.address)}</p>
                                </div>
                                <div class="loc-arrow"><i class="fas fa-chevron-left" aria-hidden="true"></i></div>
                            </div>
                        `).join('');

                    grid.querySelectorAll('.location-card-item').forEach(card => {
                        card.addEventListener('click', () => {
                            const coords = card.getAttribute('data-coords');
                            const name = card.getAttribute('data-name');
                            window.open(
                                `https://www.google.com/maps/search/?api=1&query=${coords}&q=${encodeURIComponent(name)}`,
                                '_blank');
                            this.closeLocation();
                        });
                    });
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  8. CHECKOUT (no delivery area)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const Checkout = {
                start() {
                    if (Cart.count === 0) return;
                    this._showCustomerForm();
                },

                _showCustomerForm(prefill) {
                    prefill = prefill || {};

                    Swal.fire({
                        title: '📝 بيانات التوصيل',
                        html: `
                                <div style="text-align:right;">
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-user" aria-hidden="true"></i> الاسم الكامل</label>
                                        <input type="text" id="custName" placeholder="أدخل اسمك" value="${UI.escape(prefill.name || '')}" autocomplete="name" />
                                    </div>
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-phone" aria-hidden="true"></i> رقم الجوال</label>
                                        <input type="tel" id="custPhone" placeholder="مثال: 01012345678" value="${UI.escape(prefill.phone || '')}" autocomplete="tel" />
                                    </div>
                                    <div class="checkout-form-group">
                                        <label><i class="fas fa-map-pin" aria-hidden="true"></i> عنوان التوصيل</label>
                                        <textarea id="custAddress" rows="2" placeholder="اكتب عنوانك بالتفصيل" autocomplete="street-address">${UI.escape(prefill.address || '')}</textarea>
                                    </div>
                                    <div class="fee-message">
                                        <i class="fas fa-info-circle" aria-hidden="true"></i>
                                        سيتم التواصل معك الان لتحديد رسوم الدليفري
                                    </div>
                                </div>
                            `,
                        showCancelButton: true,
                        cancelButtonText: 'إلغاء',
                        cancelButtonColor: '#8a7a6a',
                        confirmButtonText: 'مراجعة الطلب ➜',
                        confirmButtonColor: '#b81a20',
                        allowOutsideClick: false,
                        didOpen: () => {
                            setTimeout(() => document.getElementById('custName')?.focus(), 150);
                        },
                        preConfirm: () => {
                            const name = document.getElementById('custName')?.value?.trim();
                            const phone = document.getElementById('custPhone')?.value?.trim();
                            const address = document.getElementById('custAddress')?.value?.trim();

                            if (!name) { Swal.showValidationMessage('يرجى إدخال الاسم'); return false; }
                            if (!phone) { Swal.showValidationMessage('يرجى إدخال رقم الجوال'); return false; }
                            if (!address) { Swal.showValidationMessage('يرجى إدخال العنوان'); return false; }
                            const cleanPhone = phone.replace(/[\s-]/g, '');
                            if (!/^\+?\d{8,15}$/.test(cleanPhone)) {
                                Swal.showValidationMessage('رقم الجوال غير صحيح');
                                return false;
                            }

                            return { name, phone: cleanPhone, address };
                        }
                    }).then((result) => {
                        if (result.isConfirmed && result.value) {
                            const { name, phone, address } = result.value;
                            this._showOrderReview(name, phone, address);
                        }
                    });
                },

                _showOrderReview(name, phone, address) {
                    const subtotal = Cart.total;

                    const rowsHtml = Cart.items.map(item => `
                            <div class="os-row">
                                <span>${UI.escape(item.name)} × ${item.quantity}</span>
                                <span>${(item.price * item.quantity).toFixed(2)} ج.م</span>
                            </div>
                        `).join('');

                    Swal.fire({
                        title: '✅ مراجعة الطلب',
                        html: `
                                <div style="text-align:right;font-size:0.8rem;margin-bottom:10px;background:var(--surface-container-low);padding:8px 12px;border-radius:10px;border:2px solid var(--outline-variant);">
                                    <div><i class="fas fa-user" style="color:var(--brand-primary);"></i> ${UI.escape(name)}</div>
                                    <div><i class="fas fa-phone" style="color:var(--brand-primary);"></i> ${UI.escape(phone)}</div>
                                    <div><i class="fas fa-map-pin" style="color:var(--brand-primary);"></i> ${UI.escape(address)}</div>
                                    <div style="margin-top:4px;color:var(--brand-primary);font-weight:600;"><i class="fas fa-truck" style="color:var(--brand-tertiary);"></i> سيتم التواصل معك لتحديد رسوم التوصيل</div>
                                </div>
                                <div class="order-summary-box">
                                    ${rowsHtml}
                                    <div class="os-row total"><span>الإجمالي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                                </div>
                                <div style="font-size:0.65rem;color:var(--on-surface-variant);text-align:center;margin-top:4px;">
                                    <i class="fas fa-whatsapp" style="color:#25D366;"></i> سيتم إرسال الطلب عبر واتساب
                                </div>
                            `,
                        showCancelButton: true,
                        cancelButtonText: '⟵ تعديل البيانات',
                        cancelButtonColor: '#8a7a6a',
                        confirmButtonText: 'إرسال عبر واتساب 📤',
                        confirmButtonColor: '#25D366',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            this._sendOrder(name, phone, address);
                        } else if (result.dismiss === Swal.DismissReason.cancel) {
                            this._showCustomerForm({ name, phone, address });
                        }
                    });
                },

                _sendOrder(name, phone, address) {
                    const subtotal = Cart.total;

                    const orderLines = Cart.items.map(item =>
                        `• ${item.name} × ${item.quantity} = ${(item.price * item.quantity).toFixed(2)} ج.م`
                    ).join('\n');

                    const messageLines = [
                        '🍽️ *طلب جديد من كشري هند*',
                        '━━━━━━━━━━━━━━━━━━━━━',
                        `👤 *الاسم:* ${name}`,
                        `📱 *الجوال:* ${phone}`,
                        `📍 *العنوان:* ${address}`,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        '📋 *تفاصيل الطلب:*',
                        orderLines,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        `💰 *إجمالي الطلب:* ${subtotal.toFixed(2)} ج.م`,
                        '🚚 *رسوم التوصيل:* سيتم التواصل معك لتحديدها',
                        '━━━━━━━━━━━━━━━━━━━━━',
                        '🌟 شكراً لثقتكم بكشري هند!'
                    ];
                    const message = messageLines.join('\n');
                    const encoded = encodeURIComponent(message);
                    const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encoded}`;
                    window.open(whatsappUrl, '_blank');

                    Cart.clear();
                    Modal.closeCart();
                    Menu.updateItems(); // تحديث جزئي بعد التفريغ
                    document.getElementById('cartBadge').textContent = '0';
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  9. APP
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const App = {
                init() {
                    Cart.init();
                    Modal.init();
                    Menu.init('menuGrid', 'bottomNav');

                    Cart.onUpdate(() => {
                        document.getElementById('cartBadge').textContent = Cart.count;
                        if (document.getElementById('cartModal')?.classList.contains('active')) {
                            Modal._renderCart();
                        }
                        // تحديث جزئي بدلاً من إعادة الرسم
                        Menu.updateItems();
                    });

                    document.getElementById('cartIconBtn')?.addEventListener('click', () => {
                        Modal.openCart();
                    });

                    document.getElementById('locationBtn')?.addEventListener('click', () => {
                        Modal.openLocation();
                    });

                    document.getElementById('locationCloseBtn')?.addEventListener('click', () => {
                        Modal.closeLocation();
                    });
                    document.getElementById('locationModal')?.addEventListener('click', (e) => {
                        if (e.target === e.currentTarget) Modal.closeLocation();
                    });

                    document.getElementById('modalCloseBtn')?.addEventListener('click', () => {
                        Modal.closeCart();
                    });
                    document.getElementById('cartModal')?.addEventListener('click', (e) => {
                        if (e.target === e.currentTarget) Modal.closeCart();
                    });

                    document.getElementById('deleteAllCartBtn')?.addEventListener('click', () => {
                        if (Cart.count === 0) return;
                        Swal.fire({
                            title: 'إفراغ السلة؟',
                            text: 'سيتم حذف جميع الأصناف',
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#ba1a1a',
                            cancelButtonColor: '#8a7a6a',
                            confirmButtonText: 'نعم، إفراغ',
                            cancelButtonText: 'إلغاء'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                Cart.clear();
                                Modal._renderCart();
                                Menu.updateItems();
                                document.getElementById('cartBadge').textContent = '0';
                            }
                        });
                    });

                    document.getElementById('checkoutBtn')?.addEventListener('click', () => {
                        Checkout.start();
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            if (document.getElementById('cartModal')?.classList.contains('active')) {
                                Modal.closeCart();
                            }
                            if (document.getElementById('locationModal')?.classList.contains('active')) {
                                Modal.closeLocation();
                            }
                        }
                        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                            e.preventDefault();
                            Modal.openCart();
                        }
                    });

                    document.getElementById('cartBadge').textContent = Cart.count;
                    setTimeout(() => LazyLoader.observeAll(), 200);
                    console.log('✅ كشري هند — تم إصلاح مشكلة وميض الصور');
                }
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => App.init());
            } else {
                App.init();
            }

        })();
    </script>
</body>
</html>
