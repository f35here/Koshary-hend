<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>كشري و حلواني هند</title>
    <link rel="icon" type="image/jpeg" href="./images/logo.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>

    <style>
        /* ═══════════════════════════════════════════════════════════════
           RESET & VARIABLES
           ═══════════════════════════════════════════════════════════════ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --brand-primary: #b81a20;
            --brand-primary-dark: #8a1015;
            --brand-secondary: #fdc003;
            --brand-secondary-dark: #7a5a00;
            --brand-tertiary: #11651d;

            --surface: #fcf7f0;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f8f1e9;
            --surface-container: #f2ebe2;
            --on-surface: #1c1a15;
            --on-surface-variant: #5a423e;
            --outline-variant: #e2bcb8;
            --outline: #8f706c;

            --error: #ba1a1a;
            --error-container: #ffdad6;

            --font-headline: 'Be Vietnam Pro', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;

            --bottom-nav-height: 68px;
            --gutter: 14px;
            --container-max: 1400px;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-dropdown: 0 12px 48px rgba(0, 0, 0, 0.12);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface);
            color: var(--on-surface);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-nav-height) + 36px);
            line-height: 1.5;
        }

        img {
            max-width: 100%;
            display: block;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            font-size: inherit;
        }
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
            border: none;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface-container);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brand-primary);
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 2px solid var(--brand-primary);
            padding: 4px 0;
        }

        .header-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2px var(--gutter);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 52px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo-wrapper {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 9999px;
            overflow: hidden;
            border: 2px solid var(--brand-secondary);
            background: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h1 {
            font-family: var(--font-headline);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--brand-primary);
            letter-spacing: -0.03em;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text .sub {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-text .sub i {
            color: var(--brand-secondary);
            font-size: 0.45rem;
        }

        .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            color: var(--brand-primary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.location-btn {
            color: var(--brand-tertiary);
            border-color: var(--brand-tertiary);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--brand-secondary);
            color: var(--brand-secondary-dark);
            font-size: 0.5rem;
            font-weight: 800;
            width: 22px;
            height: 22px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-headline);
            border: 2px solid var(--surface-container-lowest);
        }

        /* ═══════════════════════════════════════════════════════════════
           MENU
           ═══════════════════════════════════════════════════════════════ */
        .menu-container {
            max-width: var(--container-max);
            margin: 12px auto 0;
            padding: 0 var(--gutter) calc(var(--bottom-nav-height) + 30px);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }

        .menu-card {
            background: var(--surface-container-lowest);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--outline-variant);
            display: flex;
            flex-direction: column;
        }

        .menu-card .card-img {
            width: 100%;
            height: 150px;
            overflow: hidden;
            background: var(--surface-container);
            flex-shrink: 0;
        }

        .menu-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .menu-card .card-img .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--outline);
            background: var(--surface-container);
        }

        .menu-card .card-body {
            padding: 12px 12px 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 4px;
        }

        .menu-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .menu-card .item-name {
            font-family: var(--font-headline);
            font-size: 0.85rem;
            font-weight: 800;
            color: #b81a20;
            line-height: 1.2;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .menu-card .item-name .name-icon {
            color: var(--brand-secondary);
            font-size: 0.55rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .menu-card .price-badge {
            background: linear-gradient(135deg, #fdc003, #fdd003);
            color: #7a5a00;
            font-family: var(--font-headline);
            font-weight: 800;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 9999px;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid rgba(253, 192, 3, 0.3);
        }

        .menu-card .item-desc {
            font-size: 0.6rem;
            color: var(--on-surface-variant);
            font-weight: 400;
            line-height: 1.3;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .menu-card .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: auto;
        }

        .menu-card .qty-stepper {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--surface-container-low);
            border-radius: 9999px;
            padding: 2px;
            border: 2px solid var(--outline-variant);
            flex-shrink: 0;
            overflow: hidden;
        }

        .menu-card .qty-stepper .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--brand-primary);
            flex-shrink: 0;
        }

        .menu-card .qty-stepper .qty-btn.qty-minus {
            background: var(--brand-primary-dark);
        }

        .menu-card .qty-stepper .qty-btn.qty-plus {
            background: var(--brand-primary);
        }

        .menu-card .qty-stepper .qty-num {
            min-width: 24px;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            font-family: var(--font-headline);
            color: var(--on-surface);
            padding: 0 4px;
        }

        .menu-card .add-btn {
            flex: 1;
            min-width: 60px;
            padding: 6px 10px;
            border-radius: 9999px;
            background: var(--brand-primary);
            color: #ffffff;
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid var(--brand-primary);
            min-height: 34px;
        }

        .menu-card .add-btn .btn-icon {
            font-size: 0.75rem;
            color: #ffffff;
        }

        .menu-card .add-btn .btn-label {
            color: #ffffff;
        }

        .menu-card .add-btn.added {
            background: var(--brand-tertiary);
            border-color: var(--brand-tertiary);
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--on-surface-variant);
            font-family: var(--font-body);
            background: var(--surface-container-low);
            border-radius: 18px;
            border: 2px dashed var(--outline-variant);
        }

        .empty-msg i {
            font-size: 2.6rem;
            color: var(--outline-variant);
            display: block;
            margin-bottom: 12px;
        }

        /* ═══════════════════════════════════════════════════════════════
           BOTTOM NAV
           ═══════════════════════════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            width: calc(100% - 24px);
            max-width: 640px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--outline-variant);
            border-radius: 28px;
            padding: 4px 4px;
            height: var(--bottom-nav-height);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .bottom-nav .nav-item {
            flex: 0 0 auto;
            padding: 4px 12px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            border: 2px solid transparent;
            background: transparent;
            color: var(--on-surface-variant);
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            white-space: nowrap;
            padding: 4px 14px;
            min-height: 48px;
            min-width: 52px;
        }

        .bottom-nav .nav-item i {
            font-size: 1rem;
            color: var(--brand-secondary-dark);
        }

        .bottom-nav .nav-item .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .bottom-nav .nav-item.active {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
            color: #ffffff;
            border-color: var(--brand-primary);
        }

        .bottom-nav .nav-item.active i {
            color: #ffffff;
        }

        /* ═══════════════════════════════════════════════════════════════
           LOCATION POPUP
           ═══════════════════════════════════════════════════════════════ */
        .location-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .location-modal-overlay.active {
            display: flex;
        }

        .location-modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: 18px;
            padding: 24px 20px 20px;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--brand-primary);
        }

        .location-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--brand-primary);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .location-modal-header h2 {
            font-family: var(--font-headline);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-modal-header h2 i {
            color: var(--brand-tertiary);
        }

        .location-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 9999px;
            background: var(--surface-container);
            border: 2px solid var(--outline-variant);
            color: var(--on-surface);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .location-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .location-card-item {
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .location-card-item .loc-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .location-card-item .loc-info {
            flex: 1;
            min-width: 0;
        }

        .location-card-item .loc-info h4 {
            font-family: var(--font-headline);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--on-surface);
        }

        .location-card-item .loc-info p {
            font-size: 0.7rem;
            color: var(--on-surface-variant);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .location-card-item .loc-info p i {
            color: var(--brand-secondary-dark);
            font-size: 0.6rem;
        }

        .location-card-item .loc-arrow {
            color: var(--brand-primary);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ═══════════════════════════════════════════════════════════════
           CART MODAL
           ═══════════════════════════════════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: 18px;
            padding: 20px 18px 18px;
            max-height: 92vh;
            overflow-y: auto;
            border: 2px solid var(--brand-primary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--brand-primary);
            padding-bottom: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-header .modal-title {
            font-family: var(--font-headline);
            font-weight: 800;
            font-size: 1rem;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-header .modal-title span {
            background: var(--brand-secondary);
            color: var(--brand-secondary-dark);
            font-size: 0.6rem;
            padding: 1px 10px;
            border-radius: 9999px;
            font-weight: 700;
        }

        .modal-header-actions {
            display: flex;
            gap: 8px;
        }

        .delete-all-btn {
            background: var(--error-container);
            border: 2px solid var(--error);
            border-radius: 9999px;
            padding: 4px 16px;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--error);
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 32px;
        }

        .cart-items-list {
            margin: 4px 0 10px;
            max-height: 34vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        .cart-items-list::-webkit-scrollbar {
            width: 3px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--outline-variant);
            gap: 8px;
            flex-wrap: wrap;
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 2;
            min-width: 100px;
        }

        .cart-item-info .ci-name {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--on-surface);
            font-family: var(--font-headline);
        }

        .cart-item-info .ci-price {
            font-size: 0.65rem;
            color: var(--on-surface-variant);
            font-weight: 500;
        }

        .cart-qty-control {
            display: flex;
            gap: 2px;
            align-items: center;
            background: var(--surface-container-low);
            border-radius: 9999px;
            padding: 2px 4px;
            border: 2px solid var(--outline-variant);
            flex-shrink: 0;
        }

        .cart-qty-control button {
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .cart-qty-control .cq-num {
            min-width: 20px;
            text-align: center;
            font-weight: 800;
            font-size: 0.75rem;
            font-family: var(--font-headline);
            color: var(--on-surface);
        }

        .cart-qty-control .cq-remove {
            color: var(--error);
        }

        .cart-item-total {
            font-weight: 800;
            font-size: 0.8rem;
            color: var(--brand-primary);
            font-family: var(--font-headline);
            flex-shrink: 0;
        }

        .cart-summary {
            border-top: 2px solid var(--brand-secondary);
            padding-top: 12px;
            margin-top: 4px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--on-surface-variant);
            margin-bottom: 2px;
            font-weight: 500;
        }

        .cart-total {
            font-size: 1.05rem;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            color: var(--brand-primary);
            font-family: var(--font-headline);
            border-top: 2px solid var(--outline-variant);
            padding-top: 8px;
            margin-top: 2px;
        }

        .cart-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .close-modal-btn {
            background: var(--surface-container);
            color: var(--on-surface);
            border: 2px solid var(--outline-variant);
            padding: 8px 18px;
            border-radius: 9999px;
            font-weight: 700;
            flex: 1;
            min-width: 70px;
            font-size: 0.8rem;
        }

        .checkout-btn {
            background: linear-gradient(135deg, var(--brand-secondary), #fdd003);
            color: var(--brand-secondary-dark);
            border: 2px solid var(--brand-secondary);
            padding: 8px 18px;
            border-radius: 9999px;
            font-weight: 800;
            flex: 1.5;
            min-width: 100px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .checkout-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ═══════════════════════════════════════════════════════════════
           CHECKOUT FORM — TWO-LEVEL DROPDOWN
           ═══════════════════════════════════════════════════════════════ */
        .checkout-form-group {
            text-align: right;
            margin-bottom: 12px;
        }

        .checkout-form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--on-surface-variant);
            font-family: var(--font-headline);
            letter-spacing: 0.2px;
        }

        .checkout-form-group label i {
            color: var(--brand-primary);
            margin-left: 6px;
        }

        .checkout-form-group input,
        .checkout-form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--outline-variant);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: var(--font-body);
            background: var(--surface-container-lowest);
            text-align: right;
            color: var(--on-surface);
            transition: border-color 0.15s ease;
        }

        .checkout-form-group input:focus,
        .checkout-form-group textarea:focus {
            border-color: var(--brand-primary);
            border-width: 3px;
        }

        .checkout-form-group textarea {
            resize: vertical;
            min-height: 44px;
        }

        /* ── Two-Level Area Dropdown ── */
        .area-dropdown-wrapper {
            position: relative;
            width: 100%;
            user-select: none;
        }

        .area-dropdown-trigger {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--outline-variant);
            border-radius: 10px;
            background: var(--surface-container-lowest);
            font-size: 0.85rem;
            font-family: var(--font-body);
            color: var(--on-surface);
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 48px;
            transition: border-color 0.15s ease;
            cursor: pointer;
        }

        .area-dropdown-trigger:hover {
            border-color: var(--brand-primary);
        }

        .area-dropdown-trigger .trigger-text {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .area-dropdown-trigger .trigger-text .loc-icon {
            color: var(--brand-primary);
            font-size: 0.9rem;
        }

        .area-dropdown-trigger .trigger-text .loc-name {
            font-weight: 600;
        }

        .area-dropdown-trigger .trigger-text .loc-fee {
            background: linear-gradient(135deg, #fdc003, #fdd003);
            color: #7a5a00;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 9999px;
            white-space: nowrap;
        }

        .area-dropdown-trigger .trigger-arrow {
            color: var(--on-surface-variant);
            font-size: 0.8rem;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .area-dropdown-trigger .trigger-arrow.open {
            transform: rotate(180deg);
        }

        .area-dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            left: 0;
            background: var(--surface-container-lowest);
            border: 2px solid var(--outline-variant);
            border-radius: 12px;
            box-shadow: var(--shadow-dropdown);
            max-height: 320px;
            overflow-y: auto;
            z-index: 50;
            padding: 6px 0;
        }

        .area-dropdown-panel.open {
            display: block;
        }

        .area-dropdown-panel::-webkit-scrollbar {
            width: 4px;
        }
        .area-dropdown-panel::-webkit-scrollbar-thumb {
            background: var(--brand-primary);
            border-radius: 10px;
        }

        /* ── Category Item (first level) ── */
        .area-category-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.1s ease;
            border-radius: 6px;
            margin: 2px 4px;
            border-bottom: 1px solid var(--outline-variant);
        }

        .area-category-item:last-child {
            border-bottom: none;
        }

        .area-category-item:hover {
            background: var(--surface-container-low);
        }

        .area-category-item .cat-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--on-surface);
        }

        .area-category-item .cat-info i {
            color: var(--brand-primary);
            font-size: 0.9rem;
        }

        .area-category-item .cat-badge {
            font-size: 0.55rem;
            padding: 0 10px;
            border-radius: 9999px;
            font-weight: 700;
            color: #ffffff;
        }

        .area-category-item .cat-badge.inside {
            background: var(--brand-tertiary);
        }

        .area-category-item .cat-badge.outside {
            background: var(--brand-primary-dark);
        }

        .area-category-item .cat-arrow {
            color: var(--on-surface-variant);
            font-size: 0.7rem;
            transition: transform 0.2s ease;
        }

        .area-category-item .cat-arrow.expanded {
            transform: rotate(180deg);
        }

        /* ── Locations Container (second level) ── */
        .area-locations-container {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            padding-right: 12px;
        }

        .area-locations-container.open {
            max-height: 500px;
        }

        .area-location-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px 6px 10px;
            cursor: pointer;
            transition: background 0.1s ease;
            border-radius: 6px;
            margin: 1px 0;
        }

        .area-location-item:hover {
            background: var(--surface-container-low);
        }

        .area-location-item.selected {
            background: var(--surface-container-low);
            border-right: 3px solid var(--brand-primary);
        }

        .area-location-item .loc-item-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--on-surface);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .area-location-item .loc-item-name .check-icon {
            color: var(--brand-tertiary);
            font-size: 0.7rem;
        }

        .area-location-item .loc-item-fee {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand-primary);
            background: var(--surface-container-low);
            padding: 1px 10px;
            border-radius: 9999px;
            border: 1px solid var(--outline-variant);
        }

        .area-location-item .loc-item-fee.gold {
            background: linear-gradient(135deg, #fdc003, #fdd003);
            color: #7a5a00;
            border-color: var(--brand-secondary);
        }

        .area-dropdown-panel .no-results {
            padding: 16px;
            text-align: center;
            color: var(--on-surface-variant);
            font-size: 0.8rem;
        }

        /* ── Fee Preview ── */
        .fee-preview {
            margin-top: 8px;
            padding: 8px 14px;
            background: linear-gradient(135deg, var(--surface-container-low), var(--surface-container));
            border-radius: 10px;
            border: 1px solid var(--outline-variant);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--on-surface-variant);
        }

        .fee-preview .fee-amount {
            font-family: var(--font-headline);
            font-weight: 800;
            color: var(--brand-primary);
            font-size: 1rem;
        }

        .fee-preview .fee-amount .fee-num {
            background: var(--brand-primary);
            color: #ffffff;
            padding: 0 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
        }

        .order-summary-box {
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            border-radius: 10px;
            padding: 8px 12px;
            text-align: right;
            font-size: 0.7rem;
            color: var(--on-surface-variant);
            margin-bottom: 8px;
            max-height: 110px;
            overflow-y: auto;
        }

        .order-summary-box .os-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 0.75rem;
        }

        .order-summary-box .os-row.border-top {
            border-top: 2px solid var(--outline-variant);
            margin-top: 4px;
            padding-top: 6px;
        }

        .order-summary-box .os-row.total {
            font-weight: 800;
            color: var(--brand-primary);
            font-size: 0.85rem;
        }

        /* ═══════════════════════════════════════════════════════════════
           FOOTER
           ═══════════════════════════════════════════════════════════════ */
        .footer-section {
            max-width: var(--container-max);
            margin: 0 auto 10px;
            padding: 0 14px 6px;
            text-align: center;
            font-family: var(--font-body);
            font-size: 0.55rem;
            color: var(--on-surface-variant);
        }

        .footer-line {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--brand-primary), var(--brand-secondary), transparent);
            margin-bottom: 10px;
            border-radius: 10px;
            opacity: 0.5;
        }

        .developer-credit {
            direction: ltr;
            unicode-bidi: embed;
            display: inline-block;
            width: 100%;
            font-weight: 500;
        }

        .developer-link {
            color: var(--brand-primary);
            font-weight: 800;
        }

        /* ═══════════════════════════════════════════════════════════════
           SWEETALERT OVERRIDES
           ═══════════════════════════════════════════════════════════════ */
        .swal2-popup.swal2-modal {
            font-family: var(--font-body) !important;
            border-radius: 18px !important;
            padding: 1.2rem !important;
            width: 92% !important;
            max-width: 440px !important;
            border: 2px solid var(--brand-primary) !important;
        }

        .swal2-popup .swal2-title {
            font-family: var(--font-headline) !important;
            color: var(--brand-primary) !important;
            font-size: 1.1rem !important;
        }

        .swal2-popup .swal2-html-container {
            font-size: 0.85rem !important;
            color: var(--on-surface) !important;
            text-align: right !important;
        }

        .swal2-popup .swal2-confirm {
            background: var(--brand-primary) !important;
            border-radius: 9999px !important;
            font-weight: 700 !important;
            padding: 8px 24px !important;
            font-size: 0.85rem !important;
        }

        .swal2-popup .swal2-cancel {
            border-radius: 9999px !important;
            font-weight: 700 !important;
            padding: 8px 24px !important;
        }

        .swal2-popup .swal2-input,
        .swal2-popup .swal2-textarea {
            border-radius: 10px !important;
            border: 2px solid var(--outline-variant) !important;
            font-family: var(--font-body) !important;
            text-align: right !important;
            padding: 10px 14px !important;
            font-size: 0.85rem !important;
        }

        .swal2-popup .swal2-input:focus,
        .swal2-popup .swal2-textarea:focus {
            border-color: var(--brand-primary) !important;
            border-width: 3px !important;
        }

        /* ═══════════════════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════════════════ */
        @media (min-width: 681px) {
            .bottom-nav .nav-item {
                padding: 6px 18px;
                font-size: 0.95rem;
            }
            .bottom-nav .nav-item i {
                font-size: 1.2rem;
            }
            .bottom-nav .nav-item .nav-label {
                font-size: 0.85rem;
            }
            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                gap: 20px;
            }
            .menu-card .card-img {
                height: 180px;
            }
            .menu-card .item-name {
                font-size: 0.95rem;
            }
            .menu-card .price-badge {
                font-size: 0.8rem;
                padding: 2px 14px;
            }
            .menu-card .add-btn {
                font-size: 0.8rem;
                padding: 8px 14px;
                min-height: 38px;
            }
            .menu-card .qty-stepper .qty-btn {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }
            .logo-wrapper {
                width: 50px;
                height: 50px;
            }
            .brand-text h1 {
                font-size: 1.3rem;
            }
            .icon-btn {
                width: 48px;
                height: 48px;
                font-size: 1.2rem;
            }
            .cart-badge {
                width: 24px;
                height: 24px;
                font-size: 0.55rem;
                top: -6px;
                right: -6px;
            }
        }

        @media (max-width: 680px) {
            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .menu-card .card-img {
                height: 115px;
            }
            .menu-card .item-name {
                font-size: 0.75rem;
            }
            .menu-card .price-badge {
                font-size: 0.6rem;
                padding: 1px 10px;
            }
            .menu-card .add-btn {
                font-size: 0.6rem;
                padding: 5px 8px;
                min-height: 30px;
            }
            .menu-card .qty-stepper .qty-btn {
                width: 26px;
                height: 26px;
                font-size: 0.8rem;
            }
            .menu-card .qty-stepper .qty-num {
                min-width: 18px;
                font-size: 0.75rem;
            }
            .menu-card .card-body {
                padding: 8px 8px 8px;
            }
            .bottom-nav {
                padding: 4px 3px;
                height: calc(var(--bottom-nav-height) - 6px);
                gap: 2px;
                border-radius: 22px;
            }
            .bottom-nav .nav-item {
                padding: 3px 8px;
                font-size: 0.75rem;
                min-height: 40px;
                min-width: 44px;
            }
            .bottom-nav .nav-item i {
                font-size: 0.9rem;
            }
            .bottom-nav .nav-item .nav-label {
                font-size: 0.65rem;
            }
            .brand-text h1 {
                font-size: 1rem;
            }
            .logo-wrapper {
                width: 38px;
                height: 38px;
            }
            .icon-btn {
                width: 38px;
                height: 38px;
                font-size: 0.9rem;
            }
            .location-modal-card {
                padding: 18px 14px 16px;
            }
            .location-card-item .loc-icon {
                width: 42px;
                height: 42px;
                font-size: 1rem;
            }
            .location-card-item .loc-info h4 {
                font-size: 0.75rem;
            }
            .modal-card {
                padding: 16px 14px 14px;
            }
            .cart-item-info .ci-name {
                font-size: 0.7rem;
            }
            .cart-qty-control button {
                width: 24px;
                height: 24px;
                font-size: 0.65rem;
            }
            .cart-item-total {
                font-size: 0.7rem;
            }
            .checkout-btn {
                font-size: 0.7rem;
                padding: 6px 14px;
                min-width: 80px;
            }
            .close-modal-btn {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .delete-all-btn {
                font-size: 0.6rem;
                padding: 3px 12px;
                min-height: 28px;
            }
            .area-dropdown-trigger {
                font-size: 0.8rem;
                padding: 8px 12px;
                min-height: 42px;
            }
            .area-category-item {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .area-location-item {
                padding: 5px 10px 5px 8px;
                font-size: 0.75rem;
            }
            .area-dropdown-panel {
                max-height: 240px;
            }
            .fee-preview {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
        }

        @media (max-width: 420px) {
            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            .menu-card .card-img {
                height: 90px;
            }
            .menu-card .item-name {
                font-size: 0.6rem;
            }
            .menu-card .price-badge {
                font-size: 0.5rem;
                padding: 1px 8px;
            }
            .menu-card .add-btn {
                font-size: 0.5rem;
                padding: 4px 6px;
                gap: 4px;
                min-height: 26px;
            }
            .menu-card .add-btn .btn-icon {
                font-size: 0.6rem;
            }
            .menu-card .qty-stepper .qty-btn {
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
            }
            .menu-card .qty-stepper .qty-num {
                min-width: 14px;
                font-size: 0.6rem;
            }
            .menu-card .card-body {
                padding: 4px 4px 8px;
            }
            .bottom-nav .nav-item {
                padding: 2px 5px;
                font-size: 0.6rem;
                min-height: 34px;
                min-width: 38px;
            }
            .bottom-nav .nav-item i {
                font-size: 0.75rem;
            }
            .bottom-nav .nav-item .nav-label {
                font-size: 0.5rem;
            }
            .brand-text h1 {
                font-size: 0.85rem;
            }
            .logo-wrapper {
                width: 32px;
                height: 32px;
            }
            .icon-btn {
                width: 32px;
                height: 32px;
                font-size: 0.75rem;
            }
            .header-container {
                padding: 2px 10px;
            }
            .location-modal-card {
                padding: 14px 10px 12px;
            }
            .location-card-item {
                padding: 10px 12px;
                gap: 10px;
            }
            .location-card-item .loc-icon {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }
            .modal-card {
                padding: 12px 10px 12px;
            }
            .cart-item-row {
                padding: 4px 0;
            }
            .cart-qty-control button {
                width: 20px;
                height: 20px;
                font-size: 0.6rem;
            }
            .cart-item-total {
                font-size: 0.6rem;
            }
            .cart-qty-control .cq-num {
                min-width: 14px;
                font-size: 0.6rem;
            }
            .cart-summary-row {
                font-size: 0.7rem;
            }
            .cart-total {
                font-size: 0.9rem;
            }
            .area-category-item {
                padding: 6px 8px;
                font-size: 0.75rem;
            }
            .area-location-item {
                padding: 4px 8px 4px 6px;
                font-size: 0.7rem;
            }
            .area-location-item .loc-item-fee {
                font-size: 0.6rem;
                padding: 0 8px;
            }
        }

        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 24px;
            }
            .menu-card .card-img {
                height: 200px;
            }
            .bottom-nav {
                padding: 4px 8px;
                gap: 4px;
            }
            .bottom-nav .nav-item {
                padding: 8px 24px;
                font-size: 1rem;
                min-height: 54px;
            }
            .bottom-nav .nav-item i {
                font-size: 1.2rem;
            }
            .bottom-nav .nav-item .nav-label {
                font-size: 0.9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            html {
                scroll-behavior: auto !important;
            }
        }

        :focus-visible {
            outline: 3px solid var(--brand-primary);
            outline-offset: 2px;
        }

        button,
        .nav-item,
        .location-card-item,
        .menu-card .add-btn,
        .menu-card .qty-stepper .qty-btn {
            min-height: 44px;
            min-width: 44px;
        }

        @media (max-width: 420px) {
            button,
            .nav-item,
            .location-card-item,
            .menu-card .add-btn,
            .menu-card .qty-stepper .qty-btn {
                min-height: 36px;
                min-width: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════
    HEADER
    ═══════════════════════════════════════════════════════════════ -->
    <header class="app-header" id="appHeader" role="banner">
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-wrapper" aria-hidden="true">
                    <img id="logoImage" src="./images/logo.jpeg" alt="شعار كشري هند" />
                </div>
                <div class="brand-text">
                    <h1>كشري هند</h1>
                    <div class="sub"><i class="fas fa-star" aria-hidden="true"></i> طعم أصيل <i class="fas fa-star" aria-hidden="true"></i></div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn location-btn" id="locationBtn" aria-label="فروع المطعم" title="فروع المطعم">
                    <i class="fas fa-store-alt" aria-hidden="true"></i>
                </button>
                <button class="icon-btn" id="cartIconBtn" aria-label="السلة">
                    <i class="fas fa-shopping-bag" aria-hidden="true"></i>
                    <span id="cartBadge" class="cart-badge" aria-label="عدد العناصر في السلة">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
    MENU
    ═══════════════════════════════════════════════════════════════ -->
    <main class="menu-container" id="mainContent" role="main">
        <div id="menuGrid" class="menu-grid" role="list">
            <div class="empty-msg" role="status"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i> جاري تحميل المنيو...</div>
        </div>
    </main>

    <!-- ═══════════════════════════════════════════════════════════════
    BOTTOM NAVIGATION
    ═══════════════════════════════════════════════════════════════ -->
    <nav class="bottom-nav" id="bottomNav" role="tablist" aria-label="تصنيفات المنيو"></nav>

    <!-- ═══════════════════════════════════════════════════════════════
    LOCATION POPUP
    ═══════════════════════════════════════════════════════════════ -->
    <div class="location-modal-overlay" id="locationModal" role="dialog" aria-modal="true" aria-labelledby="locationModalTitle">
        <div class="location-modal-card">
            <div class="location-modal-header">
                <h2 id="locationModalTitle"><i class="fas fa-store-alt" aria-hidden="true"></i> فروع كشري هند</h2>
                <button class="location-close-btn" id="locationCloseBtn" aria-label="إغلاق"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
            <div class="location-grid" id="locationGrid" role="list">
                <!-- rendered by JS -->
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
    CART MODAL
    ═══════════════════════════════════════════════════════════════ -->
    <div class="modal-overlay" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="cartModalTitle">
