<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8B2A20" />
    <title>كشري هند</title>
    <link rel="icon" type="image/jpeg" href="./images/logo.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ══════════════════════════════════════════════
           DESIGN SYSTEM
           ══════════════════════════════════════════════ */
        :root {
            /* Brand — mapped to professional palette */
            --brand-primary: #8B2A20;
            --brand-primary-dark: #6B1D15;
            --brand-secondary: #A67C3A;
            --brand-secondary-dark: #7A5A20;
            --brand-tertiary: #2E5D3D;

            /* Surfaces */
            --surface: #FAF8F4;
            --surface-container-lowest: #FFFFFF;
            --surface-container-low: #F4F1EC;
            --surface-container: #EDEAE3;

            /* Text */
            --on-surface: #1F1B18;
            --on-surface-variant: #4A443E;

            /* Lines */
            --outline-variant: #E8E2D8;
            --outline: #8A8179;

            /* States */
            --error: #B43C3C;
            --error-container: #FCEDED;

            /* Aliases used in inline styles */
            --primary: #8B2A20;
            --primary-soft: #F7E9E7;

            /* Typography */
            --font-headline: 'Cairo', sans-serif;
            --font-body: 'Cairo', system-ui, -apple-system, sans-serif;
            --font-mono: 'Space Grotesk', 'Cairo', sans-serif;

            /* Layout */
            --bottom-nav-height: 68px;
            --gutter: 20px;
            --container-max: 1200px;

            /* Radii */
            --r-xs: 4px;
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-pill: 999px;

            /* Shadows */
            --shadow-sm: 0 1px 3px rgba(31, 27, 24, 0.06), 0 1px 2px rgba(31, 27, 24, 0.04);
            --shadow-md: 0 4px 16px rgba(31, 27, 24, 0.08);
            --shadow-lg: 0 12px 32px rgba(31, 27, 24, 0.12);

            /* Motion */
            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 320ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Reset ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface);
            color: var(--on-surface);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-nav-height) + 40px);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        img { max-width: 100%; display: block; }
        a { text-decoration: none; color: inherit; }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            font-size: inherit;
        }
        input, textarea, select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
            border: none;
        }

        .hidden { display: none !important; }

        /* ══════════════════════════════════════════════
           SCROLLBAR
           ══════════════════════════════════════════════ */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--outline) transparent;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--outline-variant);
            border-radius: var(--r-pill);
            border: 2px solid var(--surface);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }
        ::-webkit-scrollbar-corner { background: transparent; }

        /* ══════════════════════════════════════════════
           HEADER
           ══════════════════════════════════════════════ */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--surface-container-lowest);
            border-bottom: 1px solid var(--outline-variant);
        }

        .header-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 14px var(--gutter);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 64px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo-wrapper {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--outline-variant);
            background: var(--surface-container-low);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text { min-width: 0; }
        .brand-text h1 {
            font-family: var(--font-headline);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--brand-primary);
            letter-spacing: -0.02em;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-text .sub {
            font-size: 0.72rem;
            font-weight: 400;
            color: var(--on-surface-variant);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-text .sub i { display: none; }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            color: var(--on-surface-variant);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
        }
        .icon-btn:hover {
            background: var(--surface-container-low);
            border-color: var(--outline);
            color: var(--brand-primary);
        }
        .icon-btn:active { transform: scale(0.96); }
        .icon-btn:focus-visible {
            outline: 2px solid var(--brand-primary);
            outline-offset: 2px;
        }
        .icon-btn.location-btn { color: var(--on-surface-variant); }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--brand-primary);
            color: #FFFFFF;
            font-size: 0.65rem;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: var(--r-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            border: 2px solid var(--surface-container-lowest);
            line-height: 1;
        }

        /* ══════════════════════════════════════════════
           MENU GRID
           ══════════════════════════════════════════════ */
        .menu-container {
            max-width: var(--container-max);
            margin: 32px auto 0;
            padding: 0 var(--gutter) calc(var(--bottom-nav-height) + 40px);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .menu-card {
            background: var(--surface-container-lowest);
            border-radius: var(--r-lg);
            overflow: hidden;
            border: 1px solid var(--outline-variant);
            display: flex;
            flex-direction: column;
            transition: border-color var(--t-slow), box-shadow var(--t-slow);
        }

        @media (hover: hover) and (pointer: fine) {
            .menu-card:hover {
                border-color: var(--outline);
                box-shadow: var(--shadow-md);
            }
            .menu-card:hover .card-img img.loaded {
                transform: scale(1.03);
            }
        }

        .menu-card .card-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: var(--surface-container);
            flex-shrink: 0;
            position: relative;
        }

        .menu-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.6s ease;
        }

        .menu-card .card-img img.loaded { opacity: 1; }

        .menu-card .card-img .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--outline);
            background: var(--surface-container);
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .menu-card .card-img img.loaded + .img-placeholder {
            display: none !important;
        }

        .menu-card .card-body {
            padding: 18px 18px 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 6px;
        }

        .menu-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .menu-card .item-name {
            font-family: var(--font-headline);
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--on-surface);
            line-height: 1.3;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .menu-card .item-name .name-icon {
            color: var(--brand-secondary);
            font-size: 0.7rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .menu-card .price-badge {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 1rem;
            color: var(--brand-primary);
            white-space: nowrap;
            flex-shrink: 0;
            direction: ltr;
            unicode-bidi: plaintext;
        }

        .menu-card .item-desc {
            font-size: 0.8rem;
            color: var(--on-surface-variant);
            font-weight: 400;
            line-height: 1.55;
            opacity: 0.85;
            margin-bottom: 12px;
            flex: 1;
        }

        .menu-card .card-actions {
            display: flex;
            gap: 8px;
            align-items: stretch;
            margin-top: auto;
        }

        /* ── Stepper ── */
        .menu-card .qty-stepper {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--outline-variant);
            border-radius: var(--r-sm);
            overflow: hidden;
            flex-shrink: 0;
            background: var(--surface-container-lowest);
            direction: ltr;
            height: 40px;
        }

        .menu-card .qty-stepper .qty-btn {
            width: 34px;
            height: 100%;
            font-weight: 500;
            font-size: 1rem;
            color: var(--on-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            flex-shrink: 0;
            transition: background var(--t-fast), color var(--t-fast);
            font-family: var(--font-mono);
        }
        .menu-card .qty-stepper .qty-btn:hover {
            background: var(--surface-container-low);
            color: var(--brand-primary);
        }
        .menu-card .qty-stepper .qty-btn:active {
            background: var(--surface-container);
        }

        .menu-card .qty-stepper .qty-num {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 0.92rem;
            font-family: var(--font-mono);
            color: var(--on-surface);
            padding: 0 4px;
            border-left: 1px solid var(--outline-variant);
            border-right: 1px solid var(--outline-variant);
            line-height: 38px;
        }

        /* ── Add button ── */
        .menu-card .add-btn {
            flex: 1;
            padding: 0 14px;
            border-radius: var(--r-sm);
            background: var(--brand-primary);
            color: #FFFFFF;
            font-family: var(--font-headline);
            font-weight: 500;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 40px;
            transition: background var(--t-fast);
            min-width: 60px;
        }

        .menu-card .add-btn:hover { background: var(--brand-primary-dark); }
        .menu-card .add-btn:active { transform: scale(0.99); }
        .menu-card .add-btn:focus-visible {
            outline: 2px solid var(--brand-primary);
            outline-offset: 2px;
        }

        .menu-card .add-btn .btn-icon { font-size: 0.8rem; }
        .menu-card .add-btn .btn-label { color: #FFFFFF; }

        .menu-card .add-btn.added {
            background: var(--brand-tertiary);
        }
        .menu-card .add-btn.added:hover { background: #254D32; }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
            color: var(--on-surface-variant);
            font-family: var(--font-body);
            background: var(--surface-container-low);
            border-radius: var(--r-lg);
            border: 1px dashed var(--outline-variant);
            font-size: 0.9rem;
        }

        .empty-msg i {
            font-size: 2rem;
            color: var(--outline);
            display: block;
            margin-bottom: 14px;
        }

        /* ══════════════════════════════════════════════
           BOTTOM NAV
           ══════════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            width: calc(100% - 32px);
            max-width: 720px;
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--r-pill);
            padding: 6px;
            height: var(--bottom-nav-height);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
            box-shadow: var(--shadow-lg);
        }

        .bottom-nav::-webkit-scrollbar { display: none; }

        .bottom-nav .nav-item {
            flex: 0 0 auto;
            padding: 10px 16px;
            border-radius: var(--r-pill);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: none;
            background: transparent;
            color: var(--on-surface-variant);
            font-family: var(--font-headline);
            font-weight: 500;
            font-size: 0.78rem;
            text-align: center;
            white-space: nowrap;
            min-height: 50px;
            transition: background var(--t-fast), color var(--t-fast);
            cursor: pointer;
            user-select: none;
        }

        .bottom-nav .nav-item i:empty { display: none; }

        .bottom-nav .nav-item .nav-label {
            font-size: 0.78rem;
            font-weight: 500;
            line-height: 1.2;
        }

        .bottom-nav .nav-item:hover {
            background: var(--surface-container-low);
            color: var(--on-surface);
        }

        .bottom-nav .nav-item.active {
            background: var(--brand-primary);
            color: #FFFFFF;
        }

        .bottom-nav .nav-item.active .nav-label { color: #FFFFFF; }

        .bottom-nav .nav-item:focus-visible {
            outline: 2px solid var(--brand-primary);
            outline-offset: 2px;
        }

        /* ══════════════════════════════════════════════
           LOCATION MODAL
           ══════════════════════════════════════════════ */
        .location-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(31, 27, 24, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .location-modal-overlay.active { display: flex; }

        .location-modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: var(--r-lg);
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--outline-variant);
            box-shadow: var(--shadow-lg);
        }

        .location-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--outline-variant);
            padding-bottom: 16px;
            margin-bottom: 16px;
            gap: 8px;
        }

        .location-modal-header h2 {
            font-family: var(--font-headline);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--on-surface);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .location-modal-header h2 i {
            color: var(--brand-primary);
            font-size: 1rem;
        }

        .location-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-container-low);
            border: 1px solid var(--outline-variant);
            color: var(--on-surface-variant);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--t-fast), border-color var(--t-fast);
        }
        .location-close-btn:hover {
            background: var(--surface-container);
            border-color: var(--outline);
        }

        .location-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .location-card-item {
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--r-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: border-color var(--t-fast), background var(--t-fast);
        }

        .location-card-item:hover {
            border-color: var(--outline);
            background: var(--surface-container-low);
        }

        .location-card-item .loc-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--r-sm);
            background: var(--surface-container-low);
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .location-card-item .loc-info {
            flex: 1;
            min-width: 0;
        }

        .location-card-item .loc-info h4 {
            font-family: var(--font-headline);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--on-surface);
            line-height: 1.4;
        }

        .location-card-item .loc-info p {
            font-size: 0.78rem;
            color: var(--on-surface-variant);
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 2px;
            line-height: 1.5;
        }

        .location-card-item .loc-info p i {
            color: var(--outline);
            font-size: 0.7rem;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .location-card-item .loc-arrow {
            color: var(--outline);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        /* ══════════════════════════════════════════════
           CART MODAL
           ══════════════════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(31, 27, 24, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: var(--r-lg);
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--outline-variant);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--outline-variant);
            gap: 8px;
        }

        .modal-header .modal-title {
            font-family: var(--font-headline);
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--on-surface);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header .modal-title i {
            font-size: 0.95rem;
            color: var(--brand-primary);
        }

        .modal-header .modal-title span {
            background: var(--surface-container-low);
            color: var(--on-surface-variant);
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: var(--r-pill);
            font-weight: 600;
            font-family: var(--font-mono);
        }

        .delete-all-btn {
            background: transparent;
            border: 1px solid var(--outline-variant);
            color: var(--on-surface-variant);
            font-size: 0.85rem;
            padding: 7px 12px;
            border-radius: var(--r-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
            font-weight: 500;
        }

        .delete-all-btn:hover {
            background: var(--surface-container-low);
            border-color: var(--outline);
            color: var(--error);
        }

        .delete-all-btn i { font-size: 0.85rem; }

        .cart-items-list {
            margin: 8px 0;
            max-height: 48vh;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--outline-variant);
            gap: 12px;
            flex-wrap: wrap;
        }

        .cart-item-row:last-child { border-bottom: none; }

        .cart-item-info {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 2;
            min-width: 100px;
        }

                        existing.quantity += 1;
                    } else {
                        this._items.push({ id, name, price, img, quantity: 1, category });
                    }
                    this._persist();
                    this._notify();
                },

                removeOne(itemId) {
                    const idx = this._items.findIndex(i => i.id === itemId);
                    if (idx === -1) return;
                    if (this._items[idx].quantity > 1) {
                        this._items[idx].quantity -= 1;
                    } else {
                        this._items.splice(idx, 1);
                    }
                    this._persist();
                    this._notify();
                },

                remove(idx) {
                    if (idx >= 0 && idx < this._items.length) {
                        this._items.splice(idx, 1);
                        this._persist();
                        this._notify();
                    }
                },

                increment(idx) {
                    if (idx >= 0 && idx < this._items.length) {
                        this._items[idx].quantity += 1;
                        this._persist();
                        this._notify();
                    }
                },

                decrement(idx) {
                    if (idx >= 0 && idx < this._items.length) {
                        if (this._items[idx].quantity > 1) {
                            this._items[idx].quantity -= 1;
                        } else {
                            this._items.splice(idx, 1);
                        }
                        this._persist();
                        this._notify();
                    }
                },

                clear() {
                    this._items = [];
                    this._persist();
                    this._notify();
                },

                onUpdate(fn) { this._listeners.push(fn); },

                _persist() { Storage.set('koshary_hind_cart', this._items); },
                _notify() {
                    this._listeners.forEach(fn => fn(this._items.slice()));
                    if (typeof Menu !== 'undefined' && Menu.updateItems) {
                        Menu.updateItems();
                    }
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  4. UI HELPERS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const UI = {
                escape(str) {
                    if (!str) return '';
                    return String(str).replace(/&/g, '&amp;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                },
                generateId(name, category) {
                    return `${category}_${name.replace(/\s/g, '')}`;
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  5. LAZY LOADER
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const LazyLoader = {
                _observer: null,

                init() {
                    if (!('IntersectionObserver' in window)) return;
                    this._observer = new IntersectionObserver((entries) => {
                        for (const entry of entries) {
                            if (entry.isIntersecting) {
                                const img = entry.target;
                                const dataSrc = img.getAttribute('data-src');
                                if (dataSrc) {
                                    img.src = dataSrc;
                                    img.removeAttribute('data-src');
                                    img.addEventListener('load', () => img.classList.add('loaded'));
                                    img.addEventListener('error', () => {
                                        img.style.display = 'none';
                                        const placeholder = img.nextElementSibling;
                                        if (placeholder && placeholder.classList.contains('img-placeholder')) {
                                            placeholder.style.display = 'flex';
                                        }
                                    });
                                }
                                this._observer.unobserve(img);
                            }
                        }
                    }, { rootMargin: '250px 0px', threshold: 0.01 });
                },

                observe(img) {
                    if (!img) return;
                    if (this._observer) {
                        this._observer.observe(img);
                    } else {
                        const dataSrc = img.getAttribute('data-src');
                        if (dataSrc) {
                            img.src = dataSrc;
                            img.removeAttribute('data-src');
                            img.addEventListener('load', () => img.classList.add('loaded'));
                            img.addEventListener('error', () => {
                                img.style.display = 'none';
                                const placeholder = img.nextElementSibling;
                                if (placeholder && placeholder.classList.contains('img-placeholder')) {
                                    placeholder.style.display = 'flex';
                                }
                            });
                        }
                    }
                },

                refresh(container) {
                    if (!container) return;
                    const imgs = container.querySelectorAll('img[data-src]');
                    for (const img of imgs) this.observe(img);
                },

                observeAll() {
                    const imgs = document.querySelectorAll('img[data-src]');
                    for (const img of imgs) this.observe(img);
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

                            <div class="loc-icon"><i class="fas ${loc.icon}" aria-hidden="true"></i></div>
                            <div class="loc-info">
                                <h4>${UI.escape(loc.name)}</h4>
                                <p><i class="fas fa-map-pin" aria-hidden="true"></i> ${UI.escape(loc.address)}</p>
                            </div>
                            <div class="loc-arrow"><i class="fas fa-chevron-left" aria-hidden="true"></i></div>
                        </div>
                    `).join('');

                    grid.querySelectorAll('.location-card-item').forEach(card => {
                        card.addEventListener('click', () => {
                            const coords = card.getAttribute('data-coords');
                            const name = card.getAttribute('data-name');
                            window.open(`https://www.google.com/maps/search/?api=1&query=${coords}&q=${encodeURIComponent(name)}`, '_blank');
                            this.closeLocation();
                        });
                    });
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  8. CHECKOUT
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const Checkout = {
                start() {
                    if (Cart.count === 0) return;
                    this._showCustomerForm();
                },

                _showCustomerForm(prefill) {
                    prefill = prefill || {};
                    Swal.fire({
                        title: 'بيانات التوصيل',
                        html: `
                            <div style="text-align:right;">
                                <div class="checkout-form-group">
                                    <label><i class="fas fa-user" aria-hidden="true"></i> الاسم الكامل</label>
                                    <input type="text" id="custName" placeholder="أدخل اسمك" value="${UI.escape(prefill.name || '')}" autocomplete="name" />
                                </div>
                                <div class="checkout-form-group">
                                    <label><i class="fas fa-phone" aria-hidden="true"></i> رقم الجوال</label>
                                    <input type="tel" id="custPhone" placeholder="مثال: 01012345678" value="${UI.escape(prefill.phone || '')}" autocomplete="tel" />
                                </div>
                                <div class="checkout-form-group">
                                    <label><i class="fas fa-map-pin" aria-hidden="true"></i> عنوان التوصيل</label>
                                    <textarea id="custAddress" rows="2" placeholder="اكتب عنوانك بالتفصيل" autocomplete="street-address">${UI.escape(prefill.address || '')}</textarea>
                                </div>
                                <div class="fee-message">
                                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                                    سيتم التواصل معك الآن لتحديد رسوم الدليفري
                                </div>
                            </div>
                        `,
                        showCancelButton: true,
                        cancelButtonText: 'إلغاء',
                        cancelButtonColor: '#FFFFFF',
                        confirmButtonText: 'مراجعة الطلب',
                        confirmButtonColor: '#8B2A20',
                        allowOutsideClick: false,
                        didOpen: () => {
                            setTimeout(() => document.getElementById('custName')?.focus(), 150);
                        },
                        preConfirm: () => {
                            const name = document.getElementById('custName')?.value?.trim();
                            const phone = document.getElementById('custPhone')?.value?.trim();
                            const address = document.getElementById('custAddress')?.value?.trim();

                            if (!name) { Swal.showValidationMessage('يرجى إدخال الاسم'); return false; }
                            if (!phone) { Swal.showValidationMessage('يرجى إدخال رقم الجوال'); return false; }
                            if (!address) { Swal.showValidationMessage('يرجى إدخال العنوان'); return false; }
                            const cleanPhone = phone.replace(/[\s-]/g, '');
                            if (!/^\+?\d{8,15}$/.test(cleanPhone)) {
                                Swal.showValidationMessage('رقم الجوال غير صحيح');
                                return false;
                            }
                            return { name, phone: cleanPhone, address };
                        }
                    }).then((result) => {
                        if (result.isConfirmed && result.value) {
                            const { name, phone, address } = result.value;
                            this._showOrderReview(name, phone, address);
                        }
                    });
                },

                _showOrderReview(name, phone, address) {
                    const subtotal = Cart.total;
                    const rowsHtml = Cart.items.map(item => `
                        <div class="os-row">
                            <span>${UI.escape(item.name)} × ${item.quantity}</span>
                            <span>${(item.price * item.quantity).toFixed(2)} ج.م</span>
                        </div>
                    `).join('');

                    Swal.fire({
                        title: 'مراجعة الطلب',
                        html: `
                            <div style="text-align:right;font-size:0.85rem;margin-bottom:10px;background:var(--surface-container-low);padding:12px 14px;border-radius:8px;border:1px solid var(--outline-variant);line-height:1.8;">
                                <div><i class="fas fa-user" style="color:var(--outline);margin-left:4px;"></i> ${UI.escape(name)}</div>
                                <div><i class="fas fa-phone" style="color:var(--outline);margin-left:4px;"></i> ${UI.escape(phone)}</div>
                                <div><i class="fas fa-map-pin" style="color:var(--outline);margin-left:4px;"></i> ${UI.escape(address)}</div>
                                <div style="margin-top:6px;color:var(--brand-primary);font-weight:500;font-size:0.8rem;"><i class="fas fa-truck" style="color:var(--brand-primary);margin-left:4px;"></i> سيتم التواصل معك لتحديد رسوم التوصيل</div>
                            </div>
                            <div class="order-summary-box">
                                ${rowsHtml}
                                <div class="os-row total"><span>الإجمالي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                            </div>
                            <div style="font-size:0.75rem;color:var(--on-surface-variant);text-align:center;margin-top:6px;">
                                <i class="fab fa-whatsapp" style="color:#25D366;"></i> سيتم إرسال الطلب عبر واتساب
                            </div>
                        `,
                        showCancelButton: true,
                        cancelButtonText: 'تعديل البيانات',
                        cancelButtonColor: '#FFFFFF',
                        confirmButtonText: 'إرسال عبر واتساب',
                        confirmButtonColor: '#25D366',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            this._sendOrder(name, phone, address);
                        } else if (result.dismiss === Swal.DismissReason.cancel) {
                            this._showCustomerForm({ name, phone, address });
                        }
                    });
                },

                _sendOrder(name, phone, address) {
                    const subtotal = Cart.total;
                    const orderLines = Cart.items.map(item =>
                        `• ${item.name} × ${item.quantity} = ${(item.price * item.quantity).toFixed(2)} ج.م`
                    ).join('\n');

                    const messageLines = [
                        '*طلب جديد — كشري هند*',
                        '━━━━━━━━━━━━━━━━━━━━━',
                        `*الاسم:* ${name}`,
                        `*الجوال:* ${phone}`,
                        `*العنوان:* ${address}`,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        '*تفاصيل الطلب:*',
                        orderLines,
                        '━━━━━━━━━━━━━━━━━━━━━',
                        `*إجمالي الطلب:* ${subtotal.toFixed(2)} ج.م`,
                        '*رسوم التوصيل:* سيتم التواصل معك لتحديدها',
                        '━━━━━━━━━━━━━━━━━━━━━',
                        'شكراً لثقتكم بكشري هند 💗'
                    ];
                    const encoded = encodeURIComponent(messageLines.join('\n'));
                    const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encoded}`;
                    window.open(whatsappUrl, '_blank');

                    Cart.clear();
                    Modal.closeCart();
                    Menu.updateItems();
                    document.getElementById('cartBadge').textContent = '0';
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  9. APP
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const App = {
                init() {
                    Cart.init();
                    Modal.init();
                    Menu.init('menuGrid', 'bottomNav');

                    Cart.onUpdate(() => {
                        document.getElementById('cartBadge').textContent = Cart.count;
                        if (document.getElementById('cartModal')?.classList.contains('active')) {
                            Modal._renderCart();
                        }
                        Menu.updateItems();
                    });

                    document.getElementById('cartIconBtn')?.addEventListener('click', () => Modal.openCart());
                    document.getElementById('locationBtn')?.addEventListener('click', () => Modal.openLocation());
                    document.getElementById('locationCloseBtn')?.addEventListener('click', () => Modal.closeLocation());
                    document.getElementById('locationModal')?.addEventListener('click', (e) => {
                        if (e.target === e.currentTarget) Modal.closeLocation();
                    });

                    document.getElementById('modalCloseBtn')?.addEventListener('click', () => Modal.closeCart());
                    document.getElementById('cartModal')?.addEventListener('click', (e) => {
                        if (e.target === e.currentTarget) Modal.closeCart();
                    });

                    document.getElementById('deleteAllCartBtn')?.addEventListener('click', () => {
                        if (Cart.count === 0) return;
                        Swal.fire({
                            title: 'إفراغ السلة؟',
                            text: 'سيتم حذف جميع الأصناف',
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#8B2A20',
                            cancelButtonColor: '#FFFFFF',
                            confirmButtonText: 'نعم، إفراغ',
                            cancelButtonText: 'إلغاء'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                Cart.clear();
                                Modal._renderCart();
                                Menu.updateItems();
                                document.getElementById('cartBadge').textContent = '0';
                            }
                        });
                    });

                    document.getElementById('checkoutBtn')?.addEventListener('click', () => Checkout.start());

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            if (document.getElementById('cartModal')?.classList.contains('active')) Modal.closeCart();
                            if (document.getElementById('locationModal')?.classList.contains('active')) Modal.closeLocation();
                        }
                        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                            e.preventDefault();
                            Modal.openCart();
                        }
                    });

                    document.getElementById('cartBadge').textContent = Cart.count;
                    setTimeout(() => LazyLoader.observeAll(), 200);
                }
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => App.init());
            } else {
                App.init();
            }

        })();
    </script>
</body>
</html>
