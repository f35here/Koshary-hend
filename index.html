<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>كشري و حلواني هند</title>
    <link rel="icon" type="image/jpeg" href="./images/logo.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ═══════════════════════════════════════════════════════════
           RESET & VARIABLES
           ═══════════════════════════════════════════════════════════ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --surface: #fcf7f0;
            --surface-dim: #e8e0d6;
            --surface-bright: #fffbf5;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f8f1e9;
            --surface-container: #f2ebe2;
            --surface-container-high: #ece5db;
            --surface-container-highest: #e6dfd5;
            --on-surface: #1c1a15;
            --on-surface-variant: #5a423e;
            --inverse-surface: #322f29;
            --inverse-on-surface: #f5efe6;
            --outline: #8f706c;
            --outline-variant: #e2bcb8;
            --surface-tint: #b81a20;

            --primary: #b81a20;
            --primary-light: #e53e45;
            --primary-dark: #8a1015;
            --on-primary: #ffffff;
            --primary-container: #d32f2f;
            --on-primary-container: #fff2f0;
            --inverse-primary: #ffb3ac;

            --secondary: #7a5a00;
            --secondary-light: #fdd003;
            --secondary-dark: #5c4200;
            --on-secondary: #ffffff;
            --secondary-container: #fdc003;
            --on-secondary-container: #6c5000;

            --tertiary: #11651d;
            --on-tertiary: #ffffff;
            --tertiary-container: #2d7a31;
            --on-tertiary-container: #d8ffd0;

            --error: #ba1a1a;
            --on-error: #ffffff;
            --error-container: #ffdad6;

            --bg-grad-start: #fcf7f0;
            --bg-grad-end: #f5ede3;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 16px 48px rgba(184, 26, 32, 0.12);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            --font-headline: 'Be Vietnam Pro', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --bottom-nav-height: 68px;
            --section-gap: 28px;
            --gutter: 14px;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(145deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            color: var(--on-surface);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-nav-height) + 30px);
        }

        img {
            max-width: 100%;
            display: block;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface-container-low);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .hidden {
            display: none !important;
        }

        /* ═══════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════ */
        .app-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(184, 26, 32, 0.08);
            padding: 4px 0;
            transition: box-shadow 0.3s ease;
        }

        .app-header.scrolled {
            box-shadow: 0 8px 32px rgba(184, 26, 32, 0.12);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo-wrapper {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: var(--radius-full);
            overflow: hidden;
            border: 2px solid var(--secondary-container);
            box-shadow: 0 4px 16px rgba(184, 26, 32, 0.15);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.04) rotate(-2deg);
            box-shadow: 0 6px 24px rgba(184, 26, 32, 0.25);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h1 {
            font-family: var(--font-headline);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.03em;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text .sub {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-text .sub i {
            color: var(--secondary-container);
            font-size: 0.5rem;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-btn:hover {
            background: var(--primary);
            color: var(--on-primary);
            border-color: var(--primary);
            transform: scale(0.92) rotate(4deg);
            box-shadow: 0 4px 16px rgba(184, 26, 32, 0.25);
        }

        .icon-btn:active {
            transform: scale(0.86);
        }

        .icon-btn.location-btn {
            color: var(--tertiary);
            border-color: var(--tertiary-container);
        }

        .icon-btn.location-btn:hover {
            background: var(--tertiary);
            color: var(--on-tertiary);
            border-color: var(--tertiary);
            box-shadow: 0 4px 16px rgba(17, 101, 29, 0.25);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--secondary-container);
            color: var(--on-secondary-container);
            font-size: 0.5rem;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-headline);
            border: 2px solid var(--surface-container-lowest);
            transition: transform 0.25s ease;
        }

        .cart-badge.pop {
            animation: badgePop 0.35s ease;
        }

        @keyframes badgePop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ═══════════════════════════════════════════════════════════
           MENU GRID – ENHANCED CARDS
           ═══════════════════════════════════════════════════════════ */
        .menu-container {
            max-width: 1400px;
            margin: 10px auto 0;
            padding: 6px var(--gutter) calc(var(--bottom-nav-height) + 30px);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }

        .menu-card {
            background: var(--surface-container-lowest);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--outline-variant);
            box-shadow: var(--card-shadow);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: cardFadeIn 0.5s ease both;
            opacity: 0;
        }

        .menu-card:nth-child(1) {
            animation-delay: 0.02s;
        }
        .menu-card:nth-child(2) {
            animation-delay: 0.06s;
        }
        .menu-card:nth-child(3) {
            animation-delay: 0.10s;
        }
        .menu-card:nth-child(4) {
            animation-delay: 0.14s;
        }
        .menu-card:nth-child(5) {
            animation-delay: 0.18s;
        }
        .menu-card:nth-child(6) {
            animation-delay: 0.22s;
        }
        .menu-card:nth-child(7) {
            animation-delay: 0.26s;
        }
        .menu-card:nth-child(8) {
            animation-delay: 0.30s;
        }
        .menu-card:nth-child(9) {
            animation-delay: 0.34s;
        }
        .menu-card:nth-child(10) {
            animation-delay: 0.38s;
        }
        .menu-card:nth-child(11) {
            animation-delay: 0.42s;
        }
        .menu-card:nth-child(12) {
            animation-delay: 0.46s;
        }
        .menu-card:nth-child(13) {
            animation-delay: 0.50s;
        }
        .menu-card:nth-child(14) {
            animation-delay: 0.54s;
        }
        .menu-card:nth-child(15) {
            animation-delay: 0.58s;
        }
        .menu-card:nth-child(16) {
            animation-delay: 0.62s;
        }

        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .menu-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: var(--primary);
            box-shadow: var(--card-shadow-hover);
        }

        .menu-card .card-img {
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: var(--surface-container);
            position: relative;
            flex-shrink: 0;
        }

        .menu-card .card-img::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .menu-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .menu-card:hover .card-img img {
            transform: scale(1.08);
        }

        .menu-card .card-img .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            color: var(--outline);
            background: var(--surface-container);
        }

        .menu-card .card-body {
            padding: 10px 12px 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .menu-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 2px;
        }

        .menu-card .item-name {
            font-family: var(--font-headline);
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .menu-card .item-name i {
            color: var(--secondary-container);
            font-size: 0.65rem;
            opacity: 0.7;
        }

        .menu-card .price-badge {
            background: linear-gradient(135deg, var(--secondary-container), var(--secondary-light));
            color: var(--on-secondary-container);
            font-family: var(--font-headline);
            font-weight: 800;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            white-space: nowrap;
            border: 2px solid var(--secondary-fixed-dim);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(253, 192, 3, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-card:hover .price-badge {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(253, 192, 3, 0.35);
        }

        .menu-card .item-desc {
            font-size: 0.6rem;
            color: var(--on-surface-variant);
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 6px;
            opacity: 0.7;
        }

        .menu-card .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: auto;
        }

        .menu-card .add-btn {
            flex: 1;
            padding: 7px 10px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--on-primary);
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 0.7rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 12px rgba(184, 26, 32, 0.2);
            position: relative;
            overflow: hidden;
        }

        .menu-card .add-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            pointer-events: none;
        }

        .menu-card .add-btn:hover {
            transform: scale(0.96);
            box-shadow: 0 6px 24px rgba(184, 26, 32, 0.35);
        }

        .menu-card .add-btn:active {
            transform: scale(0.90);
        }

        .menu-card .add-btn.added {
            background: linear-gradient(135deg, var(--tertiary), #0a4a12);
            border-color: var(--tertiary);
            box-shadow: 0 4px 16px rgba(17, 101, 29, 0.3);
        }

        .menu-card .add-btn .btn-icon {
            transition: transform 0.3s ease;
        }

        .menu-card .add-btn:hover .btn-icon {
            transform: translateX(-3px) scale(1.1);
        }

        .menu-card .addon-tag {
            display: inline-block;
            background: var(--tertiary-fixed-dim);
            color: var(--on-tertiary-fixed);
            font-size: 0.45rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: var(--radius-full);
            font-family: var(--font-headline);
            letter-spacing: 0.3px;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--on-surface-variant);
            font-family: var(--font-body);
            background: var(--surface-container-low);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--outline-variant);
        }

        .empty-msg i {
            font-size: 2.4rem;
            color: var(--outline-variant);
            display: block;
            margin-bottom: 10px;
        }

        /* ═══════════════════════════════════════════════════════════
           BOTTOM NAV
           ═══════════════════════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            width: calc(100% - 24px);
            max-width: 620px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--outline-variant);
            border-radius: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
            padding: 6px 4px;
            height: var(--bottom-nav-height);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 3px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .bottom-nav .nav-item {
            flex: 0 0 auto;
            min-width: auto;
            padding: 4px 8px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid transparent;
            background: transparent;
            color: var(--on-surface-variant);
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            white-space: nowrap;
            position: relative;
            padding: 4px 10px;
        }

        .bottom-nav .nav-item i {
            font-size: 1.1rem;
            color: var(--secondary);
            transition: all 0.3s ease;
        }

        .bottom-nav .nav-item .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.1;
            transition: color 0.3s ease;
        }

        .bottom-nav .nav-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--on-primary);
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(184, 26, 32, 0.3);
            transform: translateY(-3px) scale(1.04);
        }

        .bottom-nav .nav-item.active i {
            color: var(--on-primary);
        }

        .bottom-nav .nav-item:hover:not(.active) {
            background: var(--surface-container);
            border-color: var(--outline-variant);
            transform: translateY(-2px);
        }

        .bottom-nav .nav-item:active {
            transform: scale(0.94);
        }

        /* ═══════════════════════════════════════════════════════════
           LOCATION POPUP
           ═══════════════════════════════════════════════════════════ */
        .location-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 16px;
            animation: overlayFade 0.3s ease;
        }

        .location-modal-overlay.active {
            display: flex;
        }

        @keyframes overlayFade {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .location-modal-card {
            background: var(--surface-container-lowest);
            width: 100%;
            max-width: 520px;
            border-radius: var(--radius-lg);
            padding: 24px 20px 20px;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--primary);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            animation: modalSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlideUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .location-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .location-modal-header h2 {
            font-family: var(--font-headline);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-modal-header h2 i {
            color: var(--tertiary);
        }

        .location-close-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--surface-container);
            border: 2px solid var(--outline-variant);
            color: var(--on-surface);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .location-close-btn:hover {
            background: var(--error);
            color: var(--on-error);
            border-color: var(--error);
            transform: rotate(90deg);
        }

        .location-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .location-card-item {
            background: var(--surface-container-low);
            border: 2px solid var(--outline-variant);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .location-card-item:hover {
            border-color: var(--primary);
            background: var(--surface-container-lowest);
            box-shadow: 0 8px 24px rgba(184, 26, 32, 0.08);
            transform: translateX(-4px) scale(1.01);
        }

        .location-card-item:active {
            transform: scale(0.97);
        }

        .location-card-item .loc-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--on-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(184, 26, 32, 0.2);
        }

        .location-card-item .loc-info {
            flex: 1;
        }

        // ── Helpers ──
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function getTotal() { return cart.reduce((s, i) => s + (i.price * i.quantity), 0); }

        function getItemCount() { return cart.reduce((s, i) => s + i.quantity, 0); }

        function loadCart() {
            try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) cart = JSON.parse(saved); } catch (e) { cart =
                []; }
            if (!Array.isArray(cart)) cart = [];
        }

        function saveCart() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); } catch (e) { console.warn(e); }
        }

        function generateId(name, category) { return `${category}_${name.replace(/\s/g, '')}`; }

            Swal.fire({

        function addItemToCart(name, price, img, category) {
            const id = generateId(name, category);
            const existing = cart.find(i => i.id === id);
            if (existing) existing.quantity++;
            else cart.push({ id, name, price, img, quantity: 1, category });
            updateCartUI();
            showAddedAlert(name);
            // badge pop
            const badge = document.getElementById('cartBadge');
            badge.classList.remove('pop');
            void badge.offsetWidth;
            badge.classList.add('pop');
        }

        // ── Render Cart Modal ──
        function renderCartModal() {
            const container = document.getElementById('cartItemsList');
            const summary = document.getElementById('cartSummary');
            const countBadge = document.getElementById('cartItemCountBadge');

            if (cart.length === 0) {
                container.innerHTML =
                    `<div class="empty-msg" style="padding:16px;"><i class="fas fa-shopping-bag"></i>السلة فارغة<br><span style="font-size:0.7rem;">أضف أطباقك المفضلة</span></div>`;
                summary.innerHTML = '';
                document.getElementById('checkoutBtn').disabled = true;
                countBadge.textContent = '0';
                return;
            }

            document.getElementById('checkoutBtn').disabled = false;
            countBadge.textContent = getItemCount();

            let html = '';
            cart.forEach((item, idx) => {
                html += `
                        <div class="cart-item-row">
                            <div class="cart-item-info">
                                <div>
                                    <div class="ci-name">${escapeHtml(item.name)}</div>
                                    <div class="ci-price">${item.price} ج.م</div>
                                </div>
                            </div>
                            <div class="cart-qty-control">
                                <button class="cq-decr" data-idx="${idx}">−</button>
                                <span class="cq-num">${item.quantity}</span>
                                <button class="cq-incr" data-idx="${idx}">+</button>
                                <button class="cq-remove" data-idx="${idx}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                            <div class="cart-item-total">${(item.price * item.quantity).toFixed(2)} ج.م</div>
                        </div>
                    `;
            });
            container.innerHTML = html;

            const subtotal = getTotal();
            const grand = subtotal + DELIVERY_FEE;
            summary.innerHTML = `
                    <div class="cart-summary-row"><span>المجموع الفرعي</span><span>${subtotal.toFixed(2)} ج.م</span></div>
                    <div class="cart-summary-row"><span>رسوم التوصيل</span><span>${DELIVERY_FEE.toFixed(2)} ج.م</span></div>
                    <div class="cart-total"><span>الإجمالي</span><span>${grand.toFixed(2)} ج.م</span></div>
                `;

            container.querySelectorAll('.cq-decr').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    if (cart[idx].quantity > 1) cart[idx].quantity--;
                    else cart.splice(idx, 1);
                    updateCartUI();
                    renderCartModal();
                });
            });
            container.querySelectorAll('.cq-incr').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    cart[idx].quantity++;
                    updateCartUI();
                    renderCartModal();
                });
            });
            container.querySelectorAll('.cq-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    cart.splice(idx, 1);
                    updateCartUI();
                    renderCartModal();
                });
            });
        }

        function updateCartUI() {
            document.getElementById("cartBadge").textContent = getItemCount();

                cancelButtonText: '⟵ تعديل البيانات',

                confirmButtonText: 'إرسال عبر واتساب 📤',

                if (result.isConfirmed) {

        function sendOrderViaWhatsApp(customerName, customerPhone, customerAddress) {
            const subtotal = getTotal();
            const grandTotal = subtotal + DELIVERY_FEE;

            const orderLines = cart.map(item =>
                `• ${item.name} × ${item.quantity} = ${(item.price * item.quantity).toFixed(2)} ج.م`
            ).join('\n');

            const messageLines = [
                '🍽️ *طلب جديد من كشري هند*',
                '━━━━━━━━━━━━━━━━━━━━━',
                `👤 *الاسم:* ${customerName}`,
                `📱 *الجوال:* ${customerPhone}`,
                `📍 *العنوان:* ${customerAddress}`,
                '━━━━━━━━━━━━━━━━━━━━━',
                '📋 *تفاصيل الطلب:*',
                orderLines,
                '━━━━━━━━━━━━━━━━━━━━━',
                `💰 *إجمالي الطلب:* ${subtotal.toFixed(2)} ج.م`,
                `🚚 *رسوم التوصيل:* ${DELIVERY_FEE.toFixed(2)} ج.م`,
                `💎 *الإجمالي النهائي:* ${grandTotal.toFixed(2)} ج.م`,
                '━━━━━━━━━━━━━━━━━━━━━',
                '🌟 شكراً لثقتكم بكشري هند!'
            ];
            const message = messageLines.join('\n');
            const encoded = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encoded}`;
            const opened = window.open(whatsappUrl, '_blank');

            Swal.fire({
                icon: 'success',
                title: '🎉 تم تجهيز الطلب!',
                text: opened ? 'تم فتح واتساب. أكمل الإرسال من هناك.' :
                    'يرجى السماح بالنوافذ المنبثقة، ثم اضغط هنا.',
                confirmButtonText: opened ? 'حسناً' : 'فتح واتساب',
                confirmButtonColor: '#25D366',
                timer: opened ? 5000 : undefined,
                timerProgressBar: opened
            }).then((res) => {
                if (!opened && res.isConfirmed) {
                    window.open(whatsappUrl, '_blank');
                }
                cart = [];
                updateCartUI();
                renderCartModal();
                document.getElementById('cartModal').classList.remove('active');
            });
        }

        // ── Event Bindings ──

        // Location
        const locModal = document.getElementById('locationModal');
        document.getElementById('locationBtn').addEventListener('click', () => {
            renderLocationPopup();
            locModal.classList.add('active');
        });
        document.getElementById('locationCloseBtn').addEventListener('click', () => locModal.classList.remove('active'));
        locModal.addEventListener('click', (e) => { if (e.target === locModal) locModal.classList.remove('active'); });

        // Cart
        const cartModal = document.getElementById('cartModal');
        document.getElementById('cartIconBtn').addEventListener('click', () => {
            renderCartModal();
            cartModal.classList.add('active');
        });
        document.getElementById('modalCloseBtn').addEventListener('click', () => cartModal.classList.remove('active'));
        cartModal.addEventListener('click', (e) => { if (e.target === cartModal) cartModal.classList.remove('active'); });

        document.getElementById('deleteAllCartBtn').addEventListener('click', () => {
            if (cart.length === 0) { Swal.fire('السلة فارغة', '', 'info'); return; }
            Swal.fire({
                title: 'إفراغ السلة؟',
                text: 'سيتم حذف جميع الأصناف',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ba1a1a',
                cancelButtonColor: '#8a7a6a',
                confirmButtonText: 'نعم، إفراغ',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    cart = [];
                    updateCartUI();
                    renderCartModal();
                    Swal.fire('تم الإفراغ', 'السلة فارغة الآن', 'success');
                }
            });
        });

        document.getElementById('checkoutBtn').addEventListener('click', startCheckout);

        // ── Header scroll shadow ──
        window.addEventListener('scroll', () => {
            const header = document.getElementById('appHeader');
            if (window.scrollY > 10) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        // ── Init ──
        loadCart();
        renderBottomNav();
        renderMenu();
        updateCartUI();

        console.log('✅ كشري هند – نسخة محسّنة!');
    </script>
</body>
</html>
